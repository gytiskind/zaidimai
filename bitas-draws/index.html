<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}.zm-back{display:inline-flex;align-items:center;justify-self:center;align-self:center;font:900 0.95rem "Nunito","Arial Rounded MT Bold",system-ui,sans-serif;color:#f3f0f7;text-decoration:none;background:#3b3846;border:3px solid;border-color:#6e6a7c #1f1c27 #1f1c27 #6e6a7c;box-shadow:0 0 0 2px #000;padding:5px 12px;touch-action:manipulation;white-space:nowrap}.zm-back:focus-visible{outline:3px solid #4de8d6;outline-offset:3px}</style>
<script src="../zm.js"></script>
<title>Bitas Draws</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* layout: top bar, then the paint grid beside (wide screens) or above (tall screens) the goal, program, command buttons and run controls */
:root {
  --night: #141b3a;
  --dusk: #3a3570;
  --stone: #3b3846;
  --stone-hi: #6e6a7c;
  --stone-lo: #1f1c27;
  --gold: #ffcc33;
  --gem: #4de8d6;
  --red: #e0402e;
  --grass: #5cbf3a;
  --grass-hi: #8ee35f;
  --grass-lo: #2f7a1c;
  --ink: #f3f0f7;
  --ink-dim: #b7b1c2;
  --c-move: #3f7fd8;
  --c-turn: #8a5fd0;
  --c-pen: #1f9c8f;
  --c-loop: #c9962a;
  --paint-a: #fdb913;
  --paint-b: #2fa84f;
  --paint-c: #d6343b;
  --pixel: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --word: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--word);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

.btn {
  font: inherit; font-weight: 800; color: var(--ink); cursor: pointer; touch-action: manipulation;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 2px #000;
}
.btn:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.btn:active { border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); }
.btn:disabled { opacity: 0.45; cursor: default; }
.small { font-family: var(--word); font-weight: 800; font-size: 0.9rem; padding: 4px 10px; }
.small[aria-pressed="true"] { background: var(--stone-lo); color: var(--ink-dim); text-decoration: line-through; }
.play {
  font-family: var(--word); font-weight: 900; font-size: 1.4rem; letter-spacing: 0.04em; color: #fff;
  background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi);
  text-shadow: 2px 2px 0 var(--grass-lo);
}
.play:active { border-color: var(--grass-lo) var(--grass-hi) var(--grass-hi) var(--grass-lo); }
.play.stop { background: var(--red); border-color: #ff8a7a #7a1a10 #7a1a10 #ff8a7a; text-shadow: 2px 2px 0 #7a1a10; }

/* top bar */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
  background: var(--stone-lo); border-bottom: 4px solid #000; min-width: 0;
}
.top .title { font-family: var(--word); font-weight: 900; font-size: 1.25rem; letter-spacing: 0.02em; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
.top .title b { color: var(--gold); }
.top .hint { flex: 1; min-width: 0; font-family: var(--word); font-weight: 800; font-size: 1rem; color: var(--gem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font-family: var(--word); font-weight: 900; font-size: 1rem; color: var(--ink); background: #000; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.count.full { color: #2a1d00; background: var(--gold); }
.count.flash { animation: flash 0.5s steps(2) 2; }
@keyframes flash { 50% { background: var(--red); color: #fff; } }

/* main */
.main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.boardWrap { position: relative; min-height: 0; display: grid; place-items: center; padding: 12px; overflow: hidden; }
#board { display: block; image-rendering: pixelated; box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0, 0, 0, 0.45); }
.side {
  display: grid; gap: 10px; align-content: start; min-height: 0;
  padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: var(--stone-lo); border-top: 4px solid #000;
}
@media (min-aspect-ratio: 5/4) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(340px, 460px); grid-template-rows: minmax(0, 1fr); }
  .side { border-top: 0; border-left: 4px solid #000; grid-template-rows: auto minmax(0, 1fr) auto auto; align-content: stretch; }
  .prog { max-height: none; }
}

/* goal */
.goal { display: flex; align-items: center; gap: 12px; }
#preview { display: block; image-rendering: pixelated; box-shadow: 0 0 0 3px #000; background: #1a1822; }
.goal span { font-weight: 900; font-size: 1.05rem; color: var(--ink-dim); }

/* program */
.prog {
  min-height: 84px; max-height: 24vh; overflow-y: auto;
  background: #0e0c14; border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--stone);
  padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; align-items: flex-start;
}
.chip {
  width: 52px; height: 52px; padding: 0; display: grid; place-items: center; cursor: pointer; color: #fff;
  border: 3px solid; box-shadow: 0 0 0 1.5px #000; touch-action: manipulation; position: relative;
}
.chip svg, .cmd svg { width: 30px; height: 30px; display: block; }
.k-F { background: var(--c-move); border-color: #7fb0ff #1f4b8f #1f4b8f #7fb0ff; }
.k-L, .k-R { background: var(--c-turn); border-color: #c0a0ff #4f2f8a #4f2f8a #c0a0ff; }
.k-U, .k-D { background: var(--c-pen); border-color: #6fe0d2 #0d5a52 #0d5a52 #6fe0d2; }
.k-A { background: var(--paint-a); border-color: #ffe08a #9a6a00 #9a6a00 #ffe08a; color: #2a1d00; }
.k-B { background: var(--paint-b); border-color: #8fe0a6 #145a28 #145a28 #8fe0a6; }
.k-C { background: var(--paint-c); border-color: #ff9a9e #6e1418 #6e1418 #ff9a9e; }
.k-P { background: var(--c-loop); border-color: #ffe08a #7a5510 #7a5510 #ffe08a; }
.chip.now { outline: 4px solid var(--gold); outline-offset: 2px; transform: translateY(-3px); }
.chip.err { outline: 4px solid var(--red); outline-offset: 2px; }
.chip.err::after { content: "!"; position: absolute; top: -12px; right: -10px; width: 22px; height: 22px; display: grid; place-items: center;
  font-family: var(--word); font-weight: 900; font-size: 1rem; color: #fff; background: var(--red); box-shadow: 0 0 0 2px #000; }
.slot {
  width: 52px; height: 52px; padding: 0; cursor: pointer; background: transparent; color: var(--ink-dim);
  border: 3px dashed var(--stone-hi); font-family: var(--word); font-weight: 900; font-size: 1.6rem; line-height: 1;
}
.slot.on { border-color: var(--gold); color: var(--gold); background: rgba(255, 204, 51, 0.1); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { background: rgba(255, 204, 51, 0.25); } }
.loop { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; padding: 6px; background: rgba(201, 150, 42, 0.18); border: 3px solid var(--c-loop); min-width: 0; max-width: 100%; }
.loop.now { border-color: var(--gold); }
.loop.err { border-color: var(--red); }
.loop .count-btn {
  height: 52px; min-width: 52px; padding: 0 8px; font-family: var(--word); font-weight: 900; font-size: 1.35rem; color: #2a1d00; cursor: pointer;
  background: var(--gold); border: 3px solid; border-color: #fff0a8 #b8861a #b8861a #fff0a8; box-shadow: 0 0 0 1.5px #000;
}
.loop .body { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 8px; border-left: 4px solid var(--c-loop); min-width: 52px; }
.empty-note { font-family: var(--word); font-weight: 800; color: var(--ink-dim); font-size: 0.95rem; align-self: center; padding: 0 4px; }

/* commands */
.palette { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.cmd {
  flex: 1 1 0; min-width: 64px; max-width: 104px; height: 72px; padding: 4px 2px; display: grid; place-items: center; gap: 2px;
  font-family: var(--word); font-weight: 900; font-size: 0.8rem; color: #fff; cursor: pointer; touch-action: manipulation;
  border: 3px solid; box-shadow: 0 0 0 2px #000; text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5);
}
.cmd.k-A { color: #2a1d00; text-shadow: none; }
.cmd:active { transform: translateY(2px); }
.cmd:disabled { opacity: 0.4; cursor: default; transform: none; }
.cmd:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.controls { display: flex; gap: 8px; }
.controls .play { flex: 2; height: 60px; }
.controls .btn:not(.play) { flex: 1; height: 60px; font-family: var(--word); font-weight: 900; font-size: 1rem; }
.busy .palette, .busy .prog { pointer-events: none; }
.busy .palette { opacity: 0.5; }

/* bug banner */
.bug {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
  width: min(92%, 420px); display: grid; gap: 8px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.96); padding: 12px 14px 14px;
  border: 4px solid var(--red); box-shadow: 0 0 0 3px #000, 6px 6px 0 3px rgba(0, 0, 0, 0.45);
  animation: rise 0.25s ease-out 0.15s both;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
.bug h3 { margin: 0; font-family: var(--word); font-weight: 900; font-size: 1.6rem; color: var(--red); letter-spacing: 0.06em; text-shadow: 2px 2px 0 #000; }
.bug p { margin: 0; font-family: var(--word); font-weight: 800; font-size: 1.1rem; }
.bug .btn { font-family: var(--word); font-weight: 900; font-size: 1.1rem; padding: 8px 26px; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 45%, rgba(12, 10, 24, 0.4), rgba(12, 10, 24, 0.85) 75%);
  overflow-y: auto;
}
.panel {
  width: 100%; max-width: 440px; display: grid; gap: 14px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.96); padding: 18px 18px 20px;
  border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0, 0, 0, 0.45);
}
h1, h2 { margin: 0; line-height: 0.95; letter-spacing: 0.03em; text-wrap: balance; }
h1 { font-family: var(--pixel); font-weight: 700; font-size: clamp(2.6rem, 12vw, 3.6rem); color: var(--gold); text-shadow: 4px 4px 0 #8a5a12, 8px 8px 0 #000; }
h1 span { display: block; font-family: var(--word); font-weight: 900; font-size: 0.72em; color: var(--gem); text-shadow: 3px 3px 0 #157a70, 6px 6px 0 #000; }
h2 { font-family: var(--word); font-weight: 900; font-size: clamp(2rem, 9vw, 2.6rem); color: var(--gem); text-shadow: 3px 3px 0 #157a70, 6px 6px 0 #000; }
.lead { margin: 0; font-family: var(--word); font-weight: 700; font-size: 1.05rem; line-height: 1.4; max-width: 32ch; }
.seg { display: flex; }
.seg .btn { font-size: 0.95rem; padding: 4px 14px; }
.seg .btn[aria-pressed="true"] { background: var(--gold); color: #2a1d00; border-color: #fff0a8 #b8861a #b8861a #fff0a8; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
.lvl {
  aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; align-content: center; gap: 4px; padding: 4px;
  font-family: var(--pixel); font-weight: 700; font-size: 1.6rem; color: var(--ink);
}
.lvl.loopy { background: #4a3b1c; }
.lvl.cur { outline: 3px solid var(--gold); outline-offset: 3px; }
.lvl:disabled { opacity: 0.35; }
.stars { display: flex; gap: 2px; justify-content: center; }
.star { width: 12px; height: 12px; background: #000; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.star.on { background: var(--gold); }
.stars.big .star { width: 44px; height: 44px; }
.stars.big { gap: 8px; }
.stars.big .star.on { animation: pop 0.35s steps(4) both; }
.stars.big .star:nth-child(2) { animation-delay: 0.15s; }
.stars.big .star:nth-child(3) { animation-delay: 0.3s; }
@keyframes pop { from { transform: scale(1.8); } to { transform: scale(1); } }
#winPic { image-rendering: pixelated; box-shadow: 0 0 0 3px #000; background: #1a1822; }
.win-note { margin: 0; font-family: var(--word); font-weight: 800; font-size: 1rem; color: var(--ink-dim); }
.win-note b { color: var(--ink); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row-btns .btn { font-family: var(--word); font-weight: 900; font-size: 1.15rem; padding: 10px 22px; }
@media (prefers-reduced-motion: reduce) {
  .slot.on, .stars.big .star.on, .count.flash, .bug { animation: none; }
}
</style>

<div id="app">
  <div class="top">
    <a class="zm-back" href="../">← Meniu</a>
    <button class="btn small" id="toLevels" type="button" data-t="levels">Lygiai</button>
    <div class="title"><span data-t="level">Lygis</span> <b id="lvlNum">1</b></div>
    <div class="hint" id="hint"></div>
    <div class="count" id="count">0</div>
    <button class="btn small" id="mute" type="button" aria-pressed="false" data-t="sound">Garsas</button>
  </div>
  <div class="main">
    <div class="boardWrap" id="boardWrap">
      <canvas id="board" aria-label="Paint grid with Bitas the robot"></canvas>
      <div class="bug" id="bug" hidden role="alert">
        <h3 data-t="bug">KLAIDA</h3>
        <p id="bugWhy"></p>
        <button class="btn" id="fix" type="button" data-t="fix">Taisyti</button>
      </div>
    </div>
    <div class="side">
      <div class="goal"><canvas id="preview" aria-hidden="true"></canvas><span data-t="goal">Nupiešk tai</span></div>
      <div class="prog" id="prog" aria-label="Program"></div>
      <div class="palette" id="palette"></div>
      <div class="controls">
        <button class="btn play" id="run" type="button" data-t="run">PALEISTI</button>
        <button class="btn" id="step" type="button" data-t="step">Žingsnis</button>
        <button class="btn" id="reset" type="button" data-t="reset">Iš naujo</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="levelsOv">
  <div class="panel">
    <div class="seg" role="group" aria-label="Language">
      <button class="btn" type="button" data-lang="lt" aria-pressed="true">LT</button>
      <button class="btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1>BITAS <span data-t="draws">PIEŠIA</span></h1>
    <p class="lead" data-t="lead"></p>
    <div class="levels" id="levels"></div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<div class="overlay" id="winOv" hidden>
  <div class="panel">
    <h2 data-t="win">NUPIEŠTA!</h2>
    <canvas id="winPic" aria-hidden="true"></canvas>
    <div class="stars big" id="winStars"><i class="star"></i><i class="star"></i><i class="star"></i></div>
    <p class="win-note" id="winNote"></p>
    <div class="row-btns">
      <button class="btn" id="again" type="button" data-t="again">Dar kartą</button>
      <button class="btn play" id="next" type="button" data-t="next">Kitas lygis</button>
    </div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<script>
(() => {
  // site profiles (zaidimai/zm.js); absent in the claude.ai version, so everything falls back
  const ZM = window.ZM || null;
  const NS = (k) => (ZM ? ZM.ns(k) : k);
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- text ---------- */
  const TXT = {
    lt: {
      lead: 'Bitas daro tik tai, ką liepi. Sudėk komandas ir nupiešk paveikslėlį.',
      draws: 'PIEŠIA', goal: 'Nupiešk tai',
      levels: 'Lygiai', level: 'Lygis', sound: 'Garsas',
      F: 'Pirmyn', L: 'Kairėn', R: 'Dešinėn', U: 'Pakelk', D: 'Nuleisk', A: 'Geltona', B: 'Žalia', C: 'Raudona', P: 'Kartok',
      run: 'PALEISTI', stop: 'STOP', step: 'Žingsnis', reset: 'Iš naujo',
      bug: 'KLAIDA', fix: 'Taisyti',
      why: {
        diff: 'Bitas daro tik tai, ką liepi. Raudoni langeliai nesutampa.',
        edge: 'Čia drobės kraštas. Bitas toliau neina.',
        empty: 'Pirma pridėk komandų.',
      },
      win: 'NUPIEŠTA!', again: 'Dar kartą', next: 'Kitas lygis',
      used: (n) => `Panaudota blokų: <b>${n}</b>`,
      par: (n) => `3 žvaigždėms reikia <b>${n}</b>.`,
      perfect: 'Tobula programa!',
      empty: 'Spausk komandą apačioje',
      hints: {
        1: 'Bitas piešia kiekvieną langelį, į kurį žengia.',
        2: 'Bitas moka suktis.',
        4: 'Kartok: tie patys blokai kelis kartus.',
        6: 'Pakelk teptuką, ir Bitas nepieš.',
        8: 'Lietuvos vėliava: rinkis spalvą.',
        9: 'Namas su stogu.',
        10: 'Žvaigždė: grįžk į vidurį.',
      },
    },
    en: {
      lead: 'Bitas does exactly what you tell him. Line up commands and paint the picture.',
      draws: 'DRAWS', goal: 'Paint this',
      levels: 'Levels', level: 'Level', sound: 'Sound',
      F: 'Forward', L: 'Left', R: 'Right', U: 'Pen up', D: 'Pen down', A: 'Yellow', B: 'Green', C: 'Red', P: 'Repeat',
      run: 'RUN', stop: 'STOP', step: 'Step', reset: 'Reset',
      bug: 'BUG', fix: 'Fix it',
      why: {
        diff: 'Bitas does exactly what you tell him. The red squares do not match.',
        edge: 'This is the edge of the canvas. Bitas stops here.',
        empty: 'Add some commands first.',
      },
      win: 'PAINTED!', again: 'Try again', next: 'Next level',
      used: (n) => `Blocks used: <b>${n}</b>`,
      par: (n) => `3 stars need <b>${n}</b>.`,
      perfect: 'Perfect program!',
      empty: 'Tap a command below',
      hints: {
        1: 'Bitas paints every square he steps on.',
        2: 'Bitas can turn.',
        4: 'Repeat: the same blocks several times.',
        6: 'Lift the pen and Bitas stops painting.',
        8: 'The Lithuanian flag: pick a color.',
        9: 'A house with a roof.',
        10: 'A star: come back to the middle.',
      },
    },
  };

  /* ---------- levels ----------
     g: target picture. '.' empty, 'a' yellow, 'b' green, 'c' red.
     s: Bitas start [x, y]; his start square is already painted yellow, pen down.
     dir: 0 up, 1 right, 2 down, 3 left. par = fewest blocks. limit = most blocks allowed.
     sol: one shortest program (used by the tests; P3(F R) = repeat 3 times). */
  const LEVELS = [
    { g: ['.......', '.......', '.aaaaa.', '.......', '.......'], s: [1, 2], dir: 1, par: 4, sol: 'F F F F' },
    { g: ['......', '.a....', '.a....', '.a....', '.aaaa.', '......'], s: [1, 1], dir: 2, par: 7, sol: 'F F F L F F F' },
    { g: ['.....', '.aaa.', '.a.a.', '.aaa.', '.....'], s: [1, 1], dir: 1, par: 10, sol: 'F F R F F R F F R F' },
    { g: ['......', '.aaaa.', '.a..a.', '.a..a.', '.aaaa.', '......'], s: [1, 1], dir: 1, par: 5, limit: 7, sol: 'P4(F F F R)' },
    { g: ['.......', '.......', '....aa.', '...aa..', '..aa...', '.aa....', '.a.....'], s: [1, 6], dir: 0, par: 5, limit: 7, sol: 'P4(F R F L)' },
    { g: ['.......', '.......', '.aaaaa.', '.......', '.aaaaa.', '.......'], s: [1, 2], dir: 1, par: 10, sol: 'P4(F) U R F D F R P4(F)' },
    { g: ['........', '........', 'aa.aa.aa', '........', '........'], s: [0, 2], dir: 1, par: 7, sol: 'F P2(U F D F F)' },
    { g: ['.......', '.......', '.aaaaa.', '.bbbbb.', '.ccccc.', '.......', '.......'], s: [1, 2], dir: 1, par: 14, sol: 'P4(F) B R F R P4(F) C L F L P4(F)' },

  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

  };

  /* ---------- storage ---------- */
  let lang = 'lt', muted = false, progress = { stars: {} };

  /* ---------- sound ---------- */
  let actx = null;

    add: () => tone(660, 0.05, 'square', 0.04),
    remove: () => tone(330, 0.06, 'square', 0.04),
    paint: (n) => tone(440 + (n % 8) * 40, 0.08, 'triangle', 0.07),
    move: () => tone(380, 0.06, 'square', 0.03),
    turn: () => tone(560, 0.08, 'triangle', 0.06, 0, 760),
    pen: () => tone(300, 0.07, 'triangle', 0.07, 0, 600),
    color: () => tone(880, 0.06, 'triangle', 0.06),
    bug: () => { tone(220, 0.16, 'square', 0.06, 0, 110); tone(140, 0.25, 'square', 0.06, 0.15, 70); },
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.13, 'square', 0.05, i * 0.08)),

  /* ---------- pixel art ---------- */
  function makeCanvas(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));

    return c;
  }
  const px = (g, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function noiseTex(seed, shades) {
    const r = rng(seed);
    return makeCanvas(16, 16, (g) => {
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(g, x, y, 1, 1, shades[(r() * shades.length) | 0]);
    });
  }
  function maskSprite(rows, colors) {
    return makeCanvas(rows[0].length, rows.length, (g) => {

    });
  }
  const PAPER = noiseTex(5, ['#2b2836', '#27242f', '#2e2b39', '#252230', '#2a2734']);
  // Bitas, seen from above, facing up (the yellow light is his front)
  const BITAS = maskSprite([
    '.....ff.....',
    '..oooooooo..',
    '.oWWWWWWWWo.',
    '.oWEWWWWEWo.',
    '.oWWWWWWWWo.',
    '.oWWWWWWWWo.',
    '.oWWkkkkWWo.',
    '.oWWkkkkWWo.',
    '.oWWWWWWWWo.',
    '..oooooooo..',
    '.tt......tt.',
    '............',
  ], { o: '#1d1d2b', W: '#e8eef5', E: '#2f7de1', k: '#ff8fc7', f: '#ffcc33', t: '#4a4a55' });
  const MARK = maskSprite([
    'xx...xx',
    'xxx.xxx',
    '.xxxxx.',
    '..xxx..',
    '.xxxxx.',
    'xxx.xxx',
    'xx...xx',
  ], { x: '#ff3b2f' });

  /* ---------- board + atlas ---------- */
  const boardWrap = $('boardWrap'), board = $('board'), ctx = board.getContext('2d');
  let T = 48, dpr = 1, atlas = null;
  const SPR = {};
  function buildAtlas() {
    const items = [];
    const add = (key, draw) => items.push({ key, draw });
    // bevel on every square: light top/left, dark bottom/right, so each step is a visible square
    const bevel = (c, hi, lo) => {
      const b = Math.max(2, Math.round(T * 0.05));
      c.fillStyle = hi; c.fillRect(0, 0, T, b); c.fillRect(0, 0, b, T);
      c.fillStyle = lo; c.fillRect(0, T - b, T, b); c.fillRect(T - b, 0, b, T);
    };
    add('paper', (c) => { c.drawImage(PAPER, 0, 0, T, T); bevel(c, 'rgba(255,255,255,0.09)', 'rgba(0,0,0,0.5)'); });
    for (const k of ['a', 'b', 'c']) {
      add('paint-' + k, (c) => {
        c.fillStyle = PAINT[k]; c.fillRect(0, 0, T, T);
        bevel(c, 'rgba(255,255,255,0.32)', 'rgba(0,0,0,0.35)');
      });
      add('ghost-' + k, (c) => {
        c.drawImage(PAPER, 0, 0, T, T);
        c.globalAlpha = 0.26; c.fillStyle = PAINT[k]; c.fillRect(0, 0, T, T); c.globalAlpha = 1;
        const d = Math.max(2, Math.round(T * 0.07));
        c.fillStyle = PAINT[k];
        for (let i = d; i < T - d; i += d * 2) { c.fillRect(i, d, d, d); c.fillRect(i, T - 2 * d, d, d); c.fillRect(d, i, d, d); c.fillRect(T - 2 * d, i, d, d); }
        bevel(c, 'rgba(255,255,255,0.09)', 'rgba(0,0,0,0.5)');
      });
    }
    add('bitas', (c) => c.drawImage(BITAS, T * 0.08, T * 0.08, T * 0.84, T * 0.84));
    add('mark', (c) => c.drawImage(MARK, T * 0.2, T * 0.2, T * 0.6, T * 0.6));
    const size = Math.ceil(T * dpr);
    const perRow = Math.max(1, Math.floor(2048 / (size + 2)));
    items.forEach((it, i) => { it.sx = (i % perRow) * (size + 2); it.sy = Math.floor(i / perRow) * (size + 2); });
    const h = (Math.floor((items.length - 1) / perRow) + 1) * (size + 2);
    atlas = makeCanvas(Math.max(256, Math.min(2048, items.length * (size + 2))), Math.max(256, h), (g) => {
      g.imageSmoothingEnabled = false;

    const s = SPR[key];
    ctx.drawImage(atlas, s.sx, s.sy, s.size, s.size, x, y, T, T);
  }

  /* small static pictures: goal preview and the win picture (drawn once per level, not per frame) */
  function drawPicture(canvas, rowsArr, cellPx) {
    const h = rowsArr.length, w = rowsArr[0].length, d = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * cellPx * d); canvas.height = Math.round(h * cellPx * d);
    canvas.style.width = w * cellPx + 'px'; canvas.style.height = h * cellPx + 'px';
    const g = canvas.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    g.fillStyle = '#1a1822'; g.fillRect(0, 0, w * cellPx, h * cellPx);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const c = rowsArr[y][x];
      g.fillStyle = c && c !== '.' ? PAINT[c] : '#2b2836';
      g.fillRect(x * cellPx + 1, y * cellPx + 1, cellPx - 2, cellPx - 2);
    }
  }

  /* ---------- game state ---------- */
  let lvlIdx = 0, L = null, cols = 0, rows = 0, target = [], paint = [];
  let prog = [], slot = null; // slot: null = main row, or a loop item
  const bitas = { x: 0, y: 0, dir: 1, ang: 0, pen: true, color: 'a' };
  let anim = null, marks = [], parts = [], t = 0, paintCount = 0;
  let run = { active: false };

  function loadLevel(i) {
    lvlIdx = i; L = LEVELS[i];
    rows = L.g.length; cols = L.g[0].length;
    target = L.g.map((r) => [...r].map((c) => (c === '.' ? null : c)));
    prog = []; slot = null;

    $('lvlNum').textContent = i + 1;

    drawPicture($('preview'), L.g, Math.max(6, Math.floor(84 / Math.max(rows, cols))));
    layoutBoard();
  }
  function resetBitas() {
    paint = target.map((r) => r.map(() => null));

    $('bug').hidden = true;
    document.querySelectorAll('.now').forEach((e) => e.classList.remove('now'));
    document.querySelectorAll('.count-btn').forEach((b) => { const it = prog[+b.dataset.n]; if (it) b.textContent = it.n + '×'; });
    document.body.classList.remove('busy');

  }

  /* ---------- program editing ---------- */
  const countBlocks = () => prog.reduce((n, it) => n + (it.t === 'P' ? 1 + it.body.length : 1), 0);
  const limit = () => L.limit || 99;
  const touched = () => run.active || marks.length || paintCount > 0 || bitas.x !== L.s[0] || bitas.y !== L.s[1] || bitas.dir !== L.dir;

  function edited() {
    if (touched()) resetBitas();
    document.querySelectorAll('.err').forEach((e) => e.classList.remove('err'));
    renderProg(); updateCount();
  }
  function addCmd(k) {
    if (countBlocks() >= limit()) {
      const c = $('count'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
      sfx.bug();
      return;
    }
    if (k === 'P') {
      const loop = { t: 'P', n: 4, body: [] };
      prog.push(loop); slot = loop;

  function itemAt(path) {

  }

  function chipHTML(it, path) {

  }
  function renderProg() {
    let h = '';
    prog.forEach((it, i) => {
      if (it.t === 'P') {
        h += `<div class="loop" data-loop="${i}">` +
          `<button class="chip k-P" type="button" data-path="${i}" aria-label="${TXT[lang].P}">${ICON.P}</button>` +
          `<button class="count-btn" type="button" data-n="${i}" aria-label="${TXT[lang].P} ${it.n}">${it.n}×</button>` +
          `<div class="body">` + it.body.map((b, j) => chipHTML(b, i + '.' + j)).join('') +
          `<button class="slot${slot === it ? ' on' : ''}" type="button" data-slot="${i}" aria-label="+">+</button></div></div>`;
      } else h += chipHTML(it, String(i));

  $('prog').addEventListener('click', (e) => {

  function updateCount() {

  /* ---------- running ---------- */
  function compile() {
    const steps = [];
    prog.forEach((it, i) => {
      if (it.t === 'P') for (let k = 0; k < it.n; k++) it.body.forEach((b, j) => steps.push({ t: b.t, path: i + '.' + j, loop: i, iter: k + 1, n: it.n }));

  }
  function setRunLabel() {

  function markNow(s) {

  }

  function splash(x, y, color) {
    const cx = (x + 0.5) * T, cy = (y + 0.5) * T;

    }
  }

  function execStep() {
    const s = run.steps[run.i++];
    run.cur = s;

    if (s.t === 'F') {

        sfx.move();
      } else {

  function startAnim(kind, data) {
    const dur = kind === 'move' ? 0.28 : kind === 'turn' ? 0.24 : kind === 'bump' ? 0.3 : 0.18;

  }

  function sameAsTarget() {
    const wrong = [];

    return wrong;
  }

  function afterAnim() {

    if (run.pendingBug) { const b = run.pendingBug; showBug(b.why, b); return; }
    if (run.i >= run.steps.length) {
      const wrong = sameAsTarget();
      if (!wrong.length) win();
      else { marks = wrong; showBug('diff', null); }
    }
  }

  function showBug(why, b) {
    if (run.active) run.halt = true;
    document.body.classList.remove('busy');
    if (b && b.x !== undefined) marks = [{ x: b.x, y: b.y, kind: 'extra' }];
    if (b && b.path) {

      const lp = chip && chip.closest('.loop');
      if (lp) lp.classList.add('err');

    $('bug').hidden = false;
    if (why !== 'empty') sfx.bug(); else sfx.remove();
    run.mode = 'done';
    setRunLabel();
  }

  function win() {
    run.active = false;
    document.body.classList.remove('busy');
    setRunLabel();
    const n = countBlocks();
    const stars = n <= L.par ? 3 : n <= L.par + 2 ? 2 : 1;
    const key = lvlIdx + 1;
    const prevStars = progress.stars[key] || 0;
    progress.stars[key] = Math.max(prevStars, stars);
    save(NS('bd-progress'), JSON.stringify(progress));
    // XP: 10 for a first clear, 20 per newly earned star; record = total stars over all levels
    if (ZM) {
      const total = Object.values(progress.stars).reduce((a, b) => a + b, 0);
      ZM.report('bitas-draws', { score: total, xp: (prevStars ? 0 : 10) + 20 * Math.max(0, stars - prevStars) });
    }
    drawPicture($('winPic'), L.g, Math.max(10, Math.floor(150 / Math.max(rows, cols))));
    document.querySelectorAll('#winStars .star').forEach((s, i) => {
      s.classList.remove('on'); void s.offsetWidth;
      s.classList.toggle('on', i < stars);
    });
    $('winNote').innerHTML = TXT[lang].used(n) + ' ' + (stars === 3 ? TXT[lang].perfect : TXT[lang].par(L.par));
    const last = lvlIdx >= LEVELS.length - 1;
    $('next').textContent = last ? TXT[lang].levels : TXT[lang].next;
    sfx.win();
    setTimeout(() => { $('winOv').hidden = false; }, 450);
  }

  $('again').addEventListener('click', () => { $('winOv').hidden = true; resetBitas(); });
  $('next').addEventListener('click', () => {
    $('winOv').hidden = true;
    if (lvlIdx >= LEVELS.length - 1) { openLevels(); return; }
    loadLevel(lvlIdx + 1);
  });

  /* ---------- loop + drawing ---------- */
  function update(dt) {
    t += dt;
    if (anim) {
      anim.t += dt / anim.dur;
      if (anim.t >= 1) { anim = null; afterAnim(); }
    }
    if (run.active && run.mode === 'run' && !anim && !run.halt) {
      run.wait -= dt;
      if (run.wait <= 0 && run.i < run.steps.length) { execStep(); run.wait = 0.08; }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.88; p.vy *= 0.88;
    }
  }

  function draw() {
    if (!atlas) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const X = x * T, Y = y * T, got = paint[y][x], want = target[y][x];
      if (got) tile('paint-' + got, X, Y);
      else if (want) tile('ghost-' + want, X, Y);
      else tile('paper', X, Y);
    }

    // Bitas
    let rx = bitas.x, ry = bitas.y, ang = bitas.ang, scale = 1;
    if (anim) {
      const e = anim.t < 0.5 ? 2 * anim.t * anim.t : 1 - Math.pow(-2 * anim.t + 2, 2) / 2;
      if (anim.kind === 'move') { rx = anim.fromX + (bitas.x - anim.fromX) * e; ry = anim.fromY + (bitas.y - anim.fromY) * e; }
      else if (anim.kind === 'turn') ang = anim.from + (anim.to - anim.from) * e;
      else if (anim.kind === 'bump') { const k = Math.sin(anim.t * Math.PI) * 0.28; rx += DX[bitas.dir] * k; ry += DY[bitas.dir] * k; }
      else if (anim.kind === 'pen') scale = 1 + Math.sin(anim.t * Math.PI) * 0.1;
    }
    ctx.save();
    ctx.translate((rx + 0.5) * T, (ry + 0.5) * T);
    ctx.rotate(ang * Math.PI / 180);
    ctx.scale(scale, scale);
    const s = SPR.bitas;
    ctx.drawImage(atlas, s.sx, s.sy, s.size, s.size, -T / 2, -T / 2, T, T);
    // the brush at his front: color when down, grey and lifted when up
    const bw = T * 0.22, bh = T * 0.16;
    if (bitas.pen) {
      ctx.fillStyle = '#000'; ctx.fillRect(-bw / 2 - 2, -T * 0.5 - 2, bw + 4, bh + 4);
      ctx.fillStyle = PAINT[bitas.color]; ctx.fillRect(-bw / 2, -T * 0.5, bw, bh);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-bw / 2, -T * 0.46, bw, bh);
      ctx.fillStyle = '#000'; ctx.fillRect(-bw / 2 - 2, -T * 0.58 - 2, bw + 4, bh + 4);
      ctx.fillStyle = '#9a96a6'; ctx.fillRect(-bw / 2, -T * 0.58, bw, bh);
      ctx.fillStyle = PAINT[bitas.color]; ctx.fillRect(-bw / 2, -T * 0.58, bw, bh * 0.35);
    }
    ctx.restore();

    for (const p of parts) {
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    if (marks.length && !anim) {
      const pulse = 0.65 + 0.35 * Math.sin(t * 7);
      for (const m of marks) {
        ctx.globalAlpha = pulse;
        if (m.kind === 'extra') tile('mark', m.x * T, m.y * T);
        else {
          const b = Math.max(3, T * 0.1);
          ctx.fillStyle = '#ff3b2f';
          ctx.fillRect(m.x * T, m.y * T, T, b); ctx.fillRect(m.x * T, (m.y + 1) * T - b, T, b);
          ctx.fillRect(m.x * T, m.y * T, b, T); ctx.fillRect((m.x + 1) * T - b, m.y * T, b, T);
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  function layoutBoard() {
    if (!L) return;
    const r = boardWrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    T = Math.floor(Math.max(16, Math.min(96, (r.width - 32) / cols, (r.height - 32) / rows)));
    board.width = Math.round(cols * T * dpr); board.height = Math.round(rows * T * dpr);
    board.style.width = cols * T + 'px'; board.style.height = rows * T + 'px';
    buildAtlas();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  /* ---------- levels screen, language, sound ---------- */
  function renderLevels() {
    const up = unlockedUpTo();
    $('levels').innerHTML = LEVELS.map((lv, i) => {
      const n = i + 1, st = progress.stars[n] || 0;
      const stars = [0, 1, 2].map((k) => `<i class="star${k < st ? ' on' : ''}"></i>`).join('');
      return `<button class="btn lvl${lv.limit ? ' loopy' : ''}${i === lvlIdx ? ' cur' : ''}" type="button" data-lvl="${i}" ${n > up ? 'disabled' : ''}
        aria-label="${TXT[lang].level} ${n}">${n}<span class="stars">${stars}</span></button>`;
    }).join('');
  }
  function openLevels() { renderLevels(); $('levelsOv').hidden = false; }
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lvl]');
    if (!b || b.disabled) return;
    ensureAudio();
    $('levelsOv').hidden = true;
    loadLevel(+b.dataset.lvl);
  });
  $('toLevels').addEventListener('click', () => { resetBitas(); openLevels(); });

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => {
      const v = TXT[lang][el.dataset.t];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    if (L) { renderPalette(); renderProg(); updateHint(); setRunLabel(); }
    renderLevels();
    save('bd-lang', lang);
  }
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));

  function setMuted(v) {
    muted = v;
    $('mute').setAttribute('aria-pressed', String(muted));
    save('bd-muted', muted ? '1' : '0');
  }
  $('mute').addEventListener('click', () => { setMuted(!muted); if (!muted) ensureAudio(); });
  setMuted(muted);

  if ('ResizeObserver' in window) new ResizeObserver(layoutBoard).observe(boardWrap);
  else window.addEventListener('resize', layoutBoard);

  loadLevel(Math.min(unlockedUpTo(), LEVELS.length) - 1);
  applyLang();
  requestAnimationFrame(frame);
})();
</script>

</html>
