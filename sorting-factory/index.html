<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}.zm-back{display:inline-flex;align-items:center;justify-self:center;align-self:center;font:900 0.95rem "Nunito","Arial Rounded MT Bold",system-ui,sans-serif;color:#f3f0f7;text-decoration:none;background:#3b3846;border:3px solid;border-color:#6e6a7c #1f1c27 #1f1c27 #6e6a7c;box-shadow:0 0 0 2px #000;padding:5px 12px;touch-action:manipulation;white-space:nowrap}.zm-back:focus-visible{outline:3px solid #4de8d6;outline-offset:3px}</style>
<script src="../zm.js"></script>
<title>Sorting Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* layout: top bar; the input strip of items; the factory: a belt running left to right through gates,
   each gate with a sign above and its own bin below, the last bin catches everything else; run controls at the bottom */
:root {
  --night: #141b3a;
  --stone: #3b3846;
  --stone-hi: #6e6a7c;
  --stone-lo: #1f1c27;
  --gold: #ffcc33;
  --gem: #4de8d6;
  --red: #e0402e;
  --grass: #5cbf3a;
  --grass-hi: #8ee35f;
  --grass-lo: #2f7a1c;
  --ink: #f3f0f7;
  --ink-dim: #b7b1c2;
  --gate: #3f7fd8;
  --gate-hi: #8ab8ff;
  --gate-lo: #1f4b8f;
  --else: #c9962a;
  --belt: #2a2733;
  --pixel: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --word: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--word); overflow: hidden;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

.btn {
  font: inherit; font-weight: 900; color: var(--ink); cursor: pointer; touch-action: manipulation;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 2px #000;
}
.btn:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.btn:active { border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); }
.btn:disabled { opacity: 0.45; cursor: default; }
.small { font-weight: 800; font-size: 0.9rem; padding: 4px 10px; }
.small[aria-pressed="true"] { background: var(--stone-lo); color: var(--ink-dim); text-decoration: line-through; }
.play {
  font-weight: 900; font-size: 1.4rem; letter-spacing: 0.04em; color: #fff;
  background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi); text-shadow: 2px 2px 0 var(--grass-lo);
}
.play:active { border-color: var(--grass-lo) var(--grass-hi) var(--grass-hi) var(--grass-lo); }
.play.stop { background: var(--red); border-color: #ff8a7a #7a1a10 #7a1a10 #ff8a7a; text-shadow: 2px 2px 0 #7a1a10; }

/* top bar */
.top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; background: var(--stone-lo); border-bottom: 4px solid #000;
}
.top .title { font-family: var(--pixel); font-size: 1.35rem; letter-spacing: 0.06em; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
.top .title b { color: var(--gold); }
.top .hint { flex: 1 1 260px; min-width: 0; font-weight: 800; font-size: 1.05rem; color: var(--gem); }

/* factory */
.factory { position: relative; min-height: 0; overflow: auto; padding: 12px 12px 8px; display: grid; gap: 14px; align-content: center; justify-items: center; }
.inbox { width: 100%; max-width: 980px; display: flex; align-items: center; gap: 8px; }
.inbox .lab { font-weight: 900; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
.queue { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 60px; padding: 4px 8px; background: #0e0c14; border: 3px solid #000; }
.plant { width: 100%; max-width: 980px; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: auto 96px 40px auto; column-gap: 10px; }
/* gate signs */
.sign-cell { grid-row: 1; display: grid; justify-items: center; align-items: end; padding-bottom: 6px; }
.sign {
  display: flex; align-items: center; gap: 6px; padding: 6px; cursor: pointer; position: relative;
  background: var(--gate); border: 4px solid; border-color: var(--gate-hi) var(--gate-lo) var(--gate-lo) var(--gate-hi); box-shadow: 0 0 0 2px #000, 0 6px 0 2px rgba(0,0,0,0.35);
}
.sign::after { content: ""; position: absolute; left: 50%; bottom: -16px; width: 8px; height: 12px; margin-left: -4px; background: #000; }
.slot {
  width: 74px; height: 74px; display: grid; place-items: center; gap: 0; padding: 0; cursor: pointer;
  font: inherit; font-weight: 900; font-size: 0.72rem; color: var(--ink);
  background: #10233f; border: 3px solid #000; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
}
.slot.empty { color: var(--gate-hi); font-size: 2.4rem; animation: invite 1.4s ease-in-out infinite; }
@keyframes invite { 50% { background: #1c3b66; } }
.slot img { width: 40px; height: 40px; image-rendering: pixelated; display: block; }
.slot:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.and { font-weight: 900; font-size: 1.1rem; color: #fff; padding: 0 2px; }
.sign.yes { background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi); }
.sign.no { filter: grayscale(0.8) brightness(0.8); }
.sign.err { background: var(--red); border-color: #ff8a7a #7a1a10 #7a1a10 #ff8a7a; }
.else-cell { grid-row: 1; display: grid; justify-items: center; align-items: end; padding-bottom: 14px; font-weight: 900; color: var(--else); font-size: 1rem; text-align: center; }
/* belt with gate frames */
.belt {
  grid-row: 2; grid-column: 1 / -1; align-self: center; height: 70px; position: relative;
  background: repeating-linear-gradient(90deg, #34303f 0 18px, var(--belt) 18px 36px);
  border: 4px solid #000; box-shadow: inset 0 -8px 0 rgba(0,0,0,0.35), inset 0 6px 0 rgba(255,255,255,0.06);
}
.belt.moving { animation: beltMove 0.6s linear infinite; }
@keyframes beltMove { to { background-position: 36px 0; } }
.frame { grid-row: 2; position: relative; z-index: 1; pointer-events: none; }
.frame::before, .frame::after { content: ""; position: absolute; top: 0; bottom: 0; width: 10px; background: var(--gate-lo); border: 2px solid #000; }
.frame::before { left: calc(50% - 52px); } .frame::after { left: calc(50% + 42px); }
.frame i { position: absolute; left: calc(50% - 52px); width: 104px; top: 0; height: 10px; background: var(--gate-lo); border: 2px solid #000; }
.frame.end i { display: none; }
.frame.end::before, .frame.end::after { display: none; }
.chute { grid-row: 3; display: grid; place-items: center; color: var(--ink-dim); font-weight: 900; font-size: 1.8rem; }
.bin {
  grid-row: 4; min-width: 0; display: grid; grid-template-rows: auto 1fr; background: #2b2835;
  border: 4px solid #000; box-shadow: inset 4px 4px 0 #4a4655, inset -4px -4px 0 #18161e;
}
.bin.else { border-color: var(--else); }
.bin-head { padding: 4px; background: #000; font-weight: 900; font-size: 0.85rem; color: var(--ink-dim); text-align: center; letter-spacing: 0.04em; text-transform: uppercase; }
.bin.else .bin-head { color: var(--else); }
.bin-body { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; min-height: 120px; align-content: flex-start; justify-content: center; }
.goal { width: 44px; height: 44px; display: grid; place-items: center; opacity: 0.25; filter: grayscale(0.3); position: relative; }
.goal.filled { opacity: 1; filter: none; animation: land 0.3s steps(3); }
.goal.missing { opacity: 1; filter: none; outline: 3px dashed var(--red); outline-offset: 1px; animation: blinkOut 0.9s steps(2) infinite; }
@keyframes blinkOut { 50% { outline-color: transparent; } }
@keyframes land { from { transform: translateY(-10px) scale(1.3); } to { transform: none; } }
.goal.wrong { opacity: 1; filter: none; }
.goal.wrong::after { content: ""; position: absolute; inset: -2px; background:
  linear-gradient(45deg, transparent 42%, var(--red) 42% 58%, transparent 58%),
  linear-gradient(-45deg, transparent 42%, var(--red) 42% 58%, transparent 58%); }
.item { display: grid; place-items: center; }
.item img { display: block; image-rendering: pixelated; }
.item.B img { width: 52px; height: 52px; }
.item.S img { width: 32px; height: 32px; }
.goal.B img { width: 40px; height: 40px; }
.goal.S img { width: 24px; height: 24px; }
.flyer { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; }

.controls { display: flex; gap: 8px; padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--stone-lo); border-top: 4px solid #000; justify-content: center; }
.controls .play { flex: 0 1 360px; height: 62px; }
.controls .btn:not(.play) { flex: 0 1 180px; height: 62px; font-size: 1rem; }
.busy .sign, .busy .slot { pointer-events: none; }

/* picker */
.picker { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: rgba(12, 10, 24, 0.7); }
.pick-panel {
  width: min(100%, 440px); display: grid; gap: 12px; padding: 14px;
  background: rgba(31, 28, 39, 0.98); border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0, 0, 0, 0.45);
}
.pick-panel h3 { margin: 0; font-weight: 900; font-size: 1.2rem; text-align: center; }
.pick-group { display: grid; gap: 6px; }
.pick-group h4 { margin: 0; font-weight: 900; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
.pick-row { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  width: 78px; height: 78px; display: grid; place-items: center; cursor: pointer; font: inherit; font-weight: 900; font-size: 0.75rem; color: var(--ink);
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi); box-shadow: 0 0 0 1.5px #000;
}
.opt img { width: 36px; height: 36px; image-rendering: pixelated; display: block; }
.opt.on { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt:focus-visible { outline: 3px solid var(--gem); outline-offset: 2px; }
.swatch { width: 34px; height: 34px; display: block; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.3), inset 3px 3px 0 rgba(255,255,255,0.25), 0 0 0 2px #000; }
.sizeico { width: 36px; height: 36px; display: grid; place-items: center; }
.sizeico i { display: block; background: var(--ink-dim); box-shadow: inset -3px -3px 0 rgba(0,0,0,0.3), 0 0 0 2px #000; }
.pick-foot { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.pick-foot .btn { font-size: 1rem; padding: 8px 16px; }

/* bug banner */
.bug {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4;
  width: min(92%, 440px); display: grid; gap: 8px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.97); padding: 12px 14px 14px;
  border: 4px solid var(--red); box-shadow: 0 0 0 3px #000, 6px 6px 0 3px rgba(0, 0, 0, 0.45);
}
.bug h3 { margin: 0; font-weight: 900; font-size: 1.6rem; color: var(--red); letter-spacing: 0.06em; text-shadow: 2px 2px 0 #000; }
.bug .why { display: flex; align-items: center; gap: 10px; }
.bug p { margin: 0; font-weight: 800; font-size: 1.1rem; text-align: left; }
.bug .btn { font-size: 1.1rem; padding: 8px 26px; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 45%, rgba(12, 10, 24, 0.4), rgba(12, 10, 24, 0.85) 75%);
}
.panel {
  width: 100%; max-width: 460px; display: grid; gap: 14px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.96); padding: 18px 18px 20px;
  border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0, 0, 0, 0.45);
}
h1, h2 { margin: 0; line-height: 0.95; letter-spacing: 0.04em; text-wrap: balance; font-weight: 900; }
h1 { font-size: clamp(2.2rem, 10vw, 3.1rem); color: var(--gold); text-shadow: 4px 4px 0 #8a5a12, 8px 8px 0 #000; }
h1 span { display: block; color: var(--gem); text-shadow: 4px 4px 0 #157a70, 8px 8px 0 #000; }
h2 { font-size: clamp(2rem, 9vw, 2.6rem); color: var(--gem); text-shadow: 3px 3px 0 #157a70, 6px 6px 0 #000; }
.lead { margin: 0; font-weight: 700; font-size: 1.05rem; line-height: 1.4; max-width: 34ch; }
.seg { display: flex; }
.seg .btn { font-size: 0.95rem; padding: 4px 14px; }
.seg .btn[aria-pressed="true"] { background: var(--gold); color: #2a1d00; border-color: #fff0a8 #b8861a #b8861a #fff0a8; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
.lvl { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; align-content: center; gap: 4px; padding: 4px; font-family: var(--pixel); font-weight: 700; font-size: 1.6rem; }
.lvl.andy { background: #3e2d5c; }
.lvl.cur { outline: 3px solid var(--gold); outline-offset: 3px; }
.lvl:disabled { opacity: 0.35; }
.stars { display: flex; gap: 2px; justify-content: center; }
.star { width: 12px; height: 12px; background: #000; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.star.on { background: var(--gold); }
.stars.big .star { width: 44px; height: 44px; }
.stars.big { gap: 8px; }
.stars.big .star.on { animation: pop 0.35s steps(4) both; }
.stars.big .star:nth-child(2) { animation-delay: 0.15s; }
.stars.big .star:nth-child(3) { animation-delay: 0.3s; }
@keyframes pop { from { transform: scale(1.8); } to { transform: scale(1); } }
.win-note { margin: 0; font-weight: 800; font-size: 1rem; color: var(--ink-dim); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row-btns .btn { font-size: 1.15rem; padding: 10px 22px; }
@media (prefers-reduced-motion: reduce) {
  .belt.moving, .goal.filled, .goal.missing, .stars.big .star.on, .slot.empty { animation: none; }
}
</style>

<div id="app">
  <div class="top">
    <a class="zm-back" href="../">← Meniu</a>
    <button class="btn small" id="toLevels" type="button" data-t="levels">Lygiai</button>
    <div class="title"><span data-t="level">Lygis</span> <b id="lvlNum">1</b></div>
    <div class="hint" id="hint"></div>
    <button class="btn small" id="mute" type="button" aria-pressed="false" data-t="sound">Garsas</button>
  </div>
  <div class="factory" id="scene">
    <div class="inbox"><span class="lab" data-t="items">Daiktai</span><div class="queue" id="queue" aria-label="Items to sort"></div></div>
    <div class="plant" id="plant"></div>
    <div class="bug" id="bug" hidden role="alert">
      <h3 data-t="bug">KLAIDA</h3>
      <div class="why"><div class="item" id="bugItem"></div><p id="bugWhy"></p></div>
      <button class="btn" id="fix" type="button" data-t="fix">Taisyti</button>
    </div>
  </div>
  <div class="controls">
    <button class="btn play" id="run" type="button" data-t="run">PALEISTI</button>
    <button class="btn" id="reset" type="button" data-t="reset">Iš naujo</button>
  </div>
</div>

<div class="picker" id="picker" hidden>
  <div class="pick-panel" role="dialog" aria-modal="true">
    <h3 data-t="pickTitle">Kokius daiktus stumti į šią dėžę?</h3>
    <div id="pickGroups"></div>
    <div class="pick-foot">
      <button class="btn" id="pickClear" type="button" data-t="clear">Nieko</button>
      <button class="btn" id="pickClose" type="button" data-t="close">Uždaryti</button>
    </div>
  </div>
</div>

<div class="overlay" id="levelsOv">
  <div class="panel">
    <div class="seg" role="group" aria-label="Language">
      <button class="btn" type="button" data-lang="lt" aria-pressed="true">LT</button>
      <button class="btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1 id="bigTitle">RŪŠIAVIMO <span>FABRIKAS</span></h1>
    <p class="lead" data-t="lead"></p>
    <div class="levels" id="levels"></div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<div class="overlay" id="winOv" hidden>
  <div class="panel">
    <h2 data-t="win">SURŪŠIUOTA!</h2>
    <div class="stars big" id="winStars"><i class="star"></i><i class="star"></i><i class="star"></i></div>
    <p class="win-note" id="winNote"></p>
    <div class="row-btns">
      <button class="btn" id="again" type="button" data-t="again">Dar kartą</button>
      <button class="btn play" id="next" type="button" data-t="next">Kitas lygis</button>
    </div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<script>
(() => {
  // site profiles (zaidimai/zm.js); absent in the claude.ai version, so everything falls back
  const ZM = window.ZM || null;
  const NS = (k) => (ZM ? ZM.ns(k) : k);
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- text ---------- */
  const TXT = {
    lt: {
      title: ['RŪŠIAVIMO', 'FABRIKAS'],
      lead: 'Daiktai važiuoja pro vartus. Paliesk vartų ženklą ir parink, kokius daiktus jie stums į savo dėžę. Kiti daiktai važiuos toliau.',
      levels: 'Lygiai', level: 'Lygis', sound: 'Garsas', items: 'Daiktai',
      run: 'PALEISTI', stop: 'STOP', reset: 'Iš naujo',
      bug: 'KLAIDA', fix: 'Taisyti', clear: 'Nieko', close: 'Uždaryti', AND: 'IR',
      pickTitle: 'Kokius daiktus stumti į šią dėžę?', elseBin: 'Visa kita', gateBin: (n) => `Dėžė ${n}`,
      why: (b) => `Šis daiktas turėjo patekti į ${b}.`, whyGate: (n) => `${n} dėžę`, whyElse: 'dėžę „Visa kita“',
      groups: { col: 'Spalva', kind: 'Forma', size: 'Dydis' },
      val: { r: 'raudona', b: 'mėlyna', g: 'žalia', y: 'geltona', c: 'kubas', o: 'kamuolys', s: 'žvaigždė', d: 'deimantas', B: 'didelis', S: 'mažas' },
      win: 'SURŪŠIUOTA!', again: 'Dar kartą', next: 'Kitas lygis',
      perfect: 'Iš pirmo karto!', runsNote: (n) => `Bandymų: ${n}. Pabandyk pataikyti greičiau.`,
      hints: {
        1: 'Pažiūrėk, ką nori dėžė po vartais. Paliesk ženklą ir parink.',
        3: 'Ko vartai nestumia, tas nuvažiuoja į galą: „Visa kita“.',
        4: 'Dabar rūšiuok pagal formą.',
        5: 'Dveji vartai: kiekvieni stumia į savo dėžę.',
        6: 'Dideli ir maži daiktai.',
        8: 'Daiktas pirma pasiekia pirmus vartus. Kurie vartai turi būti pirmi?',
        9: 'IR: daiktas turi tikti abiem ženklams.',
      },
    },
    en: {
      title: ['SORTING', 'FACTORY'],
      lead: 'Items ride through gates. Tap a gate sign and pick which items it pushes into its bin. Everything else rides on.',
      levels: 'Levels', level: 'Level', sound: 'Sound', items: 'Items',
      run: 'RUN', stop: 'STOP', reset: 'Reset',
      bug: 'BUG', fix: 'Fix it', clear: 'Nothing', close: 'Close', AND: 'AND',
      pickTitle: 'Which items go into this bin?', elseBin: 'Everything else', gateBin: (n) => `Bin ${n}`,
      why: (b) => `This item belonged in ${b}.`, whyGate: (n) => `bin ${n}`, whyElse: 'the "Everything else" bin',
      groups: { col: 'Color', kind: 'Shape', size: 'Size' },
      val: { r: 'red', b: 'blue', g: 'green', y: 'yellow', c: 'cube', o: 'ball', s: 'star', d: 'gem', B: 'big', S: 'small' },
      win: 'SORTED!', again: 'Try again', next: 'Next level',
      perfect: 'First try!', runsNote: (n) => `Tries: ${n}. Try to get it faster.`,
      hints: {
        1: 'Look at what the bin under the gate wants. Tap the sign and pick.',
        3: 'What no gate pushes rides to the end: "Everything else".',
        4: 'Now sort by shape.',
        5: 'Two gates: each pushes into its own bin.',
        6: 'Big and small items.',
        8: 'An item reaches the first gate first. Which gate must come first?',
        9: 'AND: the item must match both signs.',
      },
    },
  };

  /* ---------- levels ----------
     item code: color (r b g y) + kind (c cube, o ball, s star, d gem) + size (B big, S small).
     gates: the reference sign of each gate, in belt order; they decide which bin every item belongs in. */
  const C = (a, v) => [a, v];
  const LEVELS = [
    { gates: [[C('col', 'r')]], items: ['rcB', 'bcB', 'rcB', 'ycB', 'bcB', 'rcB'] },
    { gates: [[C('col', 'b')]], items: ['bcB', 'roB', 'boB', 'gcB', 'bcB', 'yoB', 'boB'] },
    { gates: [[C('col', 'y')]], items: ['ycB', 'gcB', 'yoB', 'rcB', 'ycB', 'boB', 'goB'] },
    { gates: [[C('kind', 's')]], items: ['rsB', 'bcB', 'ysB', 'gsB', 'roB', 'bsB', 'ycB'] },
    { gates: [[C('kind', 'o')], [C('kind', 'd')]], items: ['roB', 'bdB', 'ycB', 'gdB', 'boB', 'rsB', 'ydB', 'goB'] },
    { gates: [[C('size', 'B')]], items: ['rcB', 'rcS', 'boS', 'yoB', 'gsS', 'bdB', 'ycS'] },
    { gates: [[C('size', 'S')], [C('col', 'g')]], items: ['rcS', 'gcB', 'boB', 'yoS', 'goB', 'bsB', 'rdS', 'gsB'] },
    { gates: [[C('col', 'r')], [C('kind', 's')]], items: ['rsB', 'ysB', 'rcB', 'bsB', 'goB', 'rsS', 'gsB', 'bcB'] },
    { gates: [[C('col', 'r'), C('kind', 'c')]], items: ['rcB', 'roB', 'bcB', 'rcS', 'rsB', 'gcB', 'rcB'], and: true },
    { gates: [[C('size', 'B'), C('col', 'y')], [C('kind', 's')]], items: ['ycB', 'ysB', 'ysS', 'rsB', 'yoS', 'bcB', 'yoB', 'gsS'], and: true },
  ];
  const attrsFor = (n) => (n <= 3 ? ['col'] : n <= 5 ? ['col', 'kind'] : ['col', 'kind', 'size']);
  const VALS = { col: ['r', 'b', 'g', 'y'], kind: ['c', 'o', 's', 'd'], size: ['B', 'S'] };
  const parseItem = (code) => ({ col: code[0], kind: code[1], size: code[2], code });
  // a gate pushes an item when every picture on its sign matches; an empty sign pushes nothing
  const gateMatches = (sign, it) => sign.some(Boolean) && sign.every((c) => !c || it[c[0]] === c[1]);
  // the first gate on the belt that matches takes the item; past the last gate it lands in "everything else"
  const binFor = (signs, it) => { for (let g = 0; g < signs.length; g++) if (gateMatches(signs[g], it)) return g; return signs.length; };

  /* ---------- storage ---------- */
  let lang = 'lt', muted = false, progress = { stars: {} };
  try {
    const l = localStorage.getItem('sf-lang'); if (l === 'lt' || l === 'en') lang = l;
    muted = localStorage.getItem('sf-muted') === '1';
    const p = JSON.parse(localStorage.getItem(NS('sf-progress')) || 'null'); if (p && p.stars) progress = p;
  } catch (e) {}
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const unlockedUpTo = () => { let n = 1; while (n < LEVELS.length && progress.stars[n]) n++; return n; };

  /* ---------- sound ---------- */
  let actx = null, noiseBuf = null;
  function ensureAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, dur, type = 'square', vol = 0.05, delay = 0, endFreq) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, cutoff) {
    if (muted || !actx || !noiseBuf) return;
    const t0 = actx.currentTime, src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t0); f.frequency.exponentialRampToValueAtTime(100, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f).connect(g).connect(actx.destination); src.start(t0); src.stop(t0 + dur);
  }
  const sfx = {
    set: () => tone(660, 0.05, 'square', 0.04),
    clear: () => tone(330, 0.06, 'square', 0.04),
    yes: () => tone(880, 0.06, 'square', 0.04),
    no: () => tone(300, 0.04, 'square', 0.02),
    push: () => tone(520, 0.09, 'square', 0.045, 0, 360),
    land: () => noise(0.08, 0.15, 1400),
    bug: () => { tone(220, 0.16, 'square', 0.06, 0, 110); tone(140, 0.25, 'square', 0.06, 0.15, 70); },
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.13, 'square', 0.05, i * 0.08)),
  };

  /* ---------- pixel sprites (drawn once into data URLs) ---------- */
  const MASK = {
    c: ['oooooooooooo', 'ollllllllllo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo',
        'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'oddddddddddo', 'oooooooooooo'],
    o: ['....oooo....', '..oollbboo..', '.olllbbbbbo.', '.ollbbbbbbo.', 'olbbbbbbbbdo', 'olbbbbbbbbdo',
        'obbbbbbbbbdo', 'obbbbbbbbddo', '.obbbbbbddo.', '.obbbbbdddo.', '..oodddddo..', '....oooo....'],
    s: ['.....oo.....', '....olbo....', '....olbo....', 'oooolbbboooo', 'olllbbbbbbdo', '.olbbbbbbdo.',
        '..obbbbbbo..', '..obbbbbbo..', '.obbbddbbbo.', '.obbo..obbo.', 'obbo....obdo', 'ooo......ooo'],
    d: ['............', '..oooooooo..', '.olllbbbbdo.', 'ollbbbbbbddo', 'oooooooooooo', 'obbbbbbbbddo',
        '.obbbbbbddo.', '..obbbbddo..', '...obbddo...', '....obdo....', '.....oo.....', '............'],
  };
  const PAL = {
    r: { b: '#e0402e', l: '#ff8a7a', d: '#9c2418', o: '#2a0d08' },
    b: { b: '#3f7fd8', l: '#8ab8ff', d: '#1f4b8f', o: '#0b1a33' },
    g: { b: '#5cbf3a', l: '#a0ec7a', d: '#2f7a1c', o: '#0f2a08' },
    y: { b: '#f2c230', l: '#fff09a', d: '#b8861a', o: '#2e2205' },
    n: { b: '#b7b1c2', l: '#f3f0f7', d: '#6e6a7c', o: '#141218' },
  };
  const SPR = {};
  function spriteURL(kind, col) {
    const key = kind + col;
    if (SPR[key]) return SPR[key];
    const S = 6, rows = MASK[kind], pal = PAL[col];
    const c = document.createElement('canvas');
    c.width = c.height = 12 * S;
    const g = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x * S, y * S, S, S); } }));
    SPR[key] = c.toDataURL();
    return SPR[key];
  }
  const itemHTML = (it, cls) => `<div class="${cls} ${it.size}"><img src="${spriteURL(it.kind, it.col)}" alt=""></div>`;
  const SWATCH = { r: '#e0402e', b: '#3f7fd8', g: '#5cbf3a', y: '#f2c230' };
  function condIcon(a, v) {
    if (a === 'col') return `<span class="swatch" style="background:${SWATCH[v]}"></span>`;
    if (a === 'kind') return `<img src="${spriteURL(v, 'n')}" alt="">`;
    const s = v === 'B' ? 30 : 15;
    return `<span class="sizeico"><i style="width:${s}px;height:${s}px"></i></span>`;
  }
  const X_ICON = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="4"/></svg>';

  /* ---------- game state ---------- */
  let lvlIdx = 0, L = null, items = [], goals = [], signs = [], runs = 0;
  let running = false, token = 0, pick = null; // pick: { g, s } gate and slot
  const scene = $('scene'), plant = $('plant'), queue = $('queue');

  function loadLevel(i) {
    lvlIdx = i; L = LEVELS[i];
    items = L.items.map(parseItem);
    goals = items.map((it) => binFor(L.gates, it));
    signs = L.gates.map((g) => g.map(() => null)); // one slot per picture the gate needs: the sign's shape is a hint
    runs = 0;
    $('lvlNum').textContent = i + 1;
    buildPlant(); resetScene(); updateHint();
  }

  // the factory: one column per gate plus the "everything else" column at the end of the belt
  function buildPlant() {
    const t = TXT[lang], n = signs.length;
    plant.style.setProperty('--n', n + 1);
    let h = '';
    for (let g = 0; g < n; g++) h += `<div class="sign-cell" style="grid-column:${g + 1}"><div class="sign" data-g="${g}"></div></div>`;
    h += `<div class="else-cell" style="grid-column:${n + 1}"></div>`;
    h += '<div class="belt" id="belt"></div>';
    for (let g = 0; g < n; g++) h += `<div class="frame" style="grid-column:${g + 1}" data-frame="${g}"><i></i></div>`;
    h += `<div class="frame end" style="grid-column:${n + 1}" data-frame="${n}"></div>`;
    for (let g = 0; g <= n; g++) h += `<div class="chute" style="grid-column:${g + 1}">&darr;</div>`;
    for (let g = 0; g <= n; g++) {
      h += `<div class="bin${g === n ? ' else' : ''}" style="grid-column:${g + 1}" data-bin="${g}">
        <div class="bin-head">${g === n ? t.elseBin : t.gateBin(g + 1)}</div>
        <div class="bin-body"></div></div>`;
    }
    plant.innerHTML = h;
    renderSigns();
  }
  function renderSigns() {
    const t = TXT[lang];
    plant.querySelectorAll('.sign').forEach((el) => {
      const g = +el.dataset.g;
      el.innerHTML = signs[g].map((c, s) => (s > 0 ? `<span class="and">${t.AND}</span>` : '') +
        (c ? `<button class="slot" type="button" data-g="${g}" data-s="${s}" aria-label="${t.val[c[1]]}">${condIcon(c[0], c[1])}<span>${t.val[c[1]]}</span></button>`
           : `<button class="slot empty" type="button" data-g="${g}" data-s="${s}" aria-label="?">?</button>`)).join('');
    });
  }

  function resetScene() {
    token++; running = false;
    document.body.classList.remove('busy');
    const belt = $('belt'); if (belt) belt.classList.remove('moving');
    plant.querySelectorAll('.sign').forEach((s) => s.classList.remove('yes', 'no', 'err'));
    $('bug').hidden = true;
    scene.querySelectorAll('.flyer').forEach((f) => f.remove());
    queue.innerHTML = items.map((it, i) => itemHTML(it, 'item').replace('class="item', `data-i="${i}" class="item`)).join('');
    plant.querySelectorAll('.bin').forEach((b) => {
      const g = +b.dataset.bin;
      b.querySelector('.bin-body').innerHTML = items.map((it, i) => (goals[i] === g ? itemHTML(it, 'goal').replace('class="goal', `data-i="${i}" class="goal`) : '')).join('');
    });
    setRunLabel();
  }
  function updateHint() {
    let k = lvlIdx + 1;
    while (k > 0 && !TXT[lang].hints[k]) k--;
    $('hint').textContent = TXT[lang].hints[k] || '';
  }

  /* ---------- picking a sign ---------- */
  plant.addEventListener('click', (e) => {
    if (running) return;
    const slot = e.target.closest('.slot');
    if (slot) { ensureAudio(); openPicker(+slot.dataset.g, +slot.dataset.s); }
  });
  function openPicker(g, s) {
    pick = { g, s };
    const t = TXT[lang], cur = signs[g][s];
    $('pickGroups').innerHTML = attrsFor(lvlIdx + 1).map((a) => `
      <div class="pick-group"><h4>${t.groups[a]}</h4><div class="pick-row">${VALS[a].map((v) =>
        `<button class="opt${cur && cur[0] === a && cur[1] === v ? ' on' : ''}" type="button" data-a="${a}" data-v="${v}">${condIcon(a, v)}<span>${t.val[v]}</span></button>`).join('')}</div></div>`).join('');
    $('picker').hidden = false;
    const on = $('pickGroups').querySelector('.on') || $('pickGroups').querySelector('.opt');
    if (on) on.focus({ preventScroll: true });
  }
  function closePicker() { $('picker').hidden = true; pick = null; }
  function edited() {
    if (!$('bug').hidden || scene.querySelector('.goal.filled, .goal.wrong')) resetScene();
    renderSigns();
  }
  $('pickGroups').addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (!b || !pick) return;
    signs[pick.g][pick.s] = C(b.dataset.a, b.dataset.v);
    sfx.set(); closePicker(); edited();
  });
  $('pickClear').addEventListener('click', () => { if (pick) { signs[pick.g][pick.s] = null; sfx.clear(); } closePicker(); edited(); });
  $('pickClose').addEventListener('click', closePicker);
  $('picker').addEventListener('click', (e) => { if (e.target === $('picker')) closePicker(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('picker').hidden) closePicker(); });

  /* ---------- running ---------- */
  const wait = (ms) => new Promise((res) => setTimeout(res, reduce ? Math.min(ms, 60) : ms));
  function center(el) {
    const r = el.getBoundingClientRect(), s = scene.getBoundingClientRect();
    return { x: r.left - s.left + scene.scrollLeft + r.width / 2, y: r.top - s.top + scene.scrollTop + r.height / 2 };
  }
  const place = (f, p) => { f.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -50%)`; };
  async function glide(f, to, ms) {
    const from = f.style.transform, end = `translate(${to.x}px, ${to.y}px) translate(-50%, -50%)`;
    if (reduce || !f.animate) { f.style.transform = end; await wait(ms); return; }
    try { const an = f.animate([{ transform: from }, { transform: end }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' }); await an.finished; } catch (e) {}
    f.style.transform = end;
  }
  function setRunLabel() { const b = $('run'); b.textContent = running ? TXT[lang].stop : TXT[lang].run; b.classList.toggle('stop', running); }
  function stopMoving() { running = false; $('belt').classList.remove('moving'); document.body.classList.remove('busy'); setRunLabel(); }

  async function run() {
    if (running) { resetScene(); return; }
    ensureAudio(); resetScene(); runs++;
    running = true;
    const my = ++token;
    document.body.classList.add('busy');
    $('belt').classList.add('moving');
    setRunLabel();
    const beltEl = $('belt'), n = signs.length;
    for (let i = 0; i < items.length; i++) {
      if (my !== token) return;
      const q = queue.querySelector(`[data-i="${i}"]`);
      const f = document.createElement('div');
      f.className = 'flyer';
      f.innerHTML = itemHTML(items[i], 'item');
      place(f, center(q));
      scene.appendChild(f);
      q.style.visibility = 'hidden';
      const bc = center(beltEl), bl = beltEl.getBoundingClientRect().width;
      await glide(f, { x: bc.x - bl / 2 + 30, y: bc.y }, 320);
      // ride through the gates in order; the first gate whose sign matches pushes the item into its bin
      let bin = n;
      for (let g = 0; g < n; g++) {
        if (my !== token) return;
        const fr = center(plant.querySelector(`[data-frame="${g}"]`));
        await glide(f, { x: fr.x, y: bc.y }, 300);
        if (my !== token) return;
        const signEl = plant.querySelector(`.sign[data-g="${g}"]`);
        const yes = gateMatches(signs[g], items[i]);
        signEl.classList.add(yes ? 'yes' : 'no');
        yes ? sfx.yes() : sfx.no();
        await wait(yes ? 260 : 160);
        signEl.classList.remove('yes', 'no');
        if (yes) { bin = g; break; }
      }
      if (my !== token) return;
      if (bin === n) await glide(f, { x: center(plant.querySelector(`[data-frame="${n}"]`)).x, y: bc.y }, 300);
      if (my !== token) return;
      const binEl = plant.querySelector(`[data-bin="${bin}"] .bin-body`);
      sfx.push();
      await glide(f, center(binEl), 340);
      if (my !== token) return;
      f.remove();
      if (bin === goals[i]) {
        plant.querySelector(`.goal[data-i="${i}"]`).classList.add('filled');
        sfx.land();
      } else {
        // wrong bin: the item shows there with a red X, its real place blinks, the gate that pushed it turns red
        binEl.insertAdjacentHTML('beforeend', itemHTML(items[i], 'goal wrong'));
        plant.querySelector(`.goal[data-i="${i}"]`).classList.add('missing');
        if (bin < n) plant.querySelector(`.sign[data-g="${bin}"]`).classList.add('err');
        const t = TXT[lang];
        $('bugItem').className = 'item ' + items[i].size;
        $('bugItem').innerHTML = `<img src="${spriteURL(items[i].kind, items[i].col)}" alt="">`;
        $('bugWhy').textContent = t.why(goals[i] === n ? t.whyElse : t.whyGate(goals[i] + 1));
        $('bug').hidden = false;
        stopMoving();
        sfx.bug();
        return;
      }
      await wait(80);
    }
    if (my !== token) return;
    stopMoving();
    win();
  }
  $('run').addEventListener('click', run);
  $('fix').addEventListener('click', () => resetScene());
  // Iš naujo: empty every sign. Taisyti keeps them.
  $('reset').addEventListener('click', () => {
    signs = L.gates.map((g) => g.map(() => null)); runs = 0;
    resetScene(); renderSigns();
  });

  function win() {
    const stars = runs <= 2 ? 3 : runs <= 4 ? 2 : 1;
    const key = lvlIdx + 1, prevStars = progress.stars[key] || 0;
    progress.stars[key] = Math.max(prevStars, stars);
    save(NS('sf-progress'), JSON.stringify(progress));
    // XP: 10 for a first clear, 20 per newly earned star; record = total stars over all levels
    if (ZM) {
      const total = Object.values(progress.stars).reduce((a, b) => a + b, 0);
      ZM.report('sorting-factory', { score: total, xp: (prevStars ? 0 : 10) + 20 * Math.max(0, stars - prevStars) });
    }
    document.querySelectorAll('#winStars .star').forEach((s, i) => { s.classList.remove('on'); void s.offsetWidth; s.classList.toggle('on', i < stars); });
    const t = TXT[lang];
    $('winNote').textContent = runs <= 1 ? t.perfect : t.runsNote(runs);
    $('next').textContent = lvlIdx >= LEVELS.length - 1 ? t.levels : t.next;
    sfx.win();
    setTimeout(() => { $('winOv').hidden = false; }, 350);
  }
  $('again').addEventListener('click', () => { $('winOv').hidden = true; runs = 0; resetScene(); });
  $('next').addEventListener('click', () => {
    $('winOv').hidden = true;
    if (lvlIdx >= LEVELS.length - 1) { openLevels(); return; }
    loadLevel(lvlIdx + 1);
  });

  /* ---------- levels screen, language, sound ---------- */
  function renderLevels() {
    const up = unlockedUpTo();
    $('levels').innerHTML = LEVELS.map((lv, i) => {
      const n = i + 1, st = progress.stars[n] || 0;
      const stars = [0, 1, 2].map((k) => `<i class="star${k < st ? ' on' : ''}"></i>`).join('');
      return `<button class="btn lvl${lv.and ? ' andy' : ''}${i === lvlIdx ? ' cur' : ''}" type="button" data-lvl="${i}" ${n > up ? 'disabled' : ''}
        aria-label="${TXT[lang].level} ${n}">${n}<span class="stars">${stars}</span></button>`;
    }).join('');
  }
  function openLevels() { resetScene(); renderLevels(); $('levelsOv').hidden = false; }
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lvl]');
    if (!b || b.disabled) return;
    ensureAudio();
    $('levelsOv').hidden = true;
    loadLevel(+b.dataset.lvl);
  });
  $('toLevels').addEventListener('click', openLevels);

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => { const v = TXT[lang][el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
    $('bigTitle').innerHTML = `${TXT[lang].title[0]} <span>${TXT[lang].title[1]}</span>`;
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    if (L) { buildPlant(); resetScene(); updateHint(); }
    renderLevels();
    save('sf-lang', lang);
  }
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));
  function setMuted(v) { muted = v; $('mute').setAttribute('aria-pressed', String(muted)); save('sf-muted', muted ? '1' : '0'); }
  $('mute').addEventListener('click', () => { setMuted(!muted); if (!muted) ensureAudio(); });
  setMuted(muted);

  loadLevel(Math.min(unlockedUpTo(), LEVELS.length) - 1);
  applyLang();
  if (location.hash === '#test') window.__sf = { get signs() { return signs; }, LEVELS, binFor, get lvl() { return lvlIdx; } };
})();
</script>

</html>
