<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}.zm-back{display:inline-flex;align-items:center;justify-self:center;align-self:center;font:900 0.95rem "Nunito","Arial Rounded MT Bold",system-ui,sans-serif;color:#f3f0f7;text-decoration:none;background:#3b3846;border:3px solid;border-color:#6e6a7c #1f1c27 #1f1c27 #6e6a7c;box-shadow:0 0 0 2px #000;padding:5px 12px;touch-action:manipulation;white-space:nowrap}.zm-back:focus-visible{outline:3px solid #4de8d6;outline-offset:3px}</style>
<script src="../zm.js"></script>
<title>Sorting Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* layout: top bar, then the factory (belt, sorter, bins) beside (wide screens) or above (tall screens) the rule list and run controls */
:root {
  --night: #141b3a;
  --dusk: #3a3570;
  --stone: #3b3846;
  --stone-hi: #6e6a7c;
  --stone-lo: #1f1c27;
  --gold: #ffcc33;
  --gem: #4de8d6;
  --red: #e0402e;
  --grass: #5cbf3a;
  --grass-hi: #8ee35f;
  --grass-lo: #2f7a1c;
  --ink: #f3f0f7;
  --ink-dim: #b7b1c2;
  --c-if: #3f7fd8;
  --c-and: #8a5fd0;
  --c-else: #c9962a;
  --belt: #2a2733;
  --pixel: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --word: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--pixel);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

.btn {
  font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; touch-action: manipulation;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 2px #000;
}
.btn:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.btn:active { border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); }
.btn:disabled { opacity: 0.45; cursor: default; }
.small { font-family: var(--word); font-weight: 800; font-size: 0.9rem; padding: 4px 10px; }
.small[aria-pressed="true"] { background: var(--stone-lo); color: var(--ink-dim); text-decoration: line-through; }
.play {
  font-family: var(--word); font-weight: 900; font-size: 1.4rem; letter-spacing: 0.04em; color: #fff;
  background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi);
  text-shadow: 2px 2px 0 var(--grass-lo);
}
.play:active { border-color: var(--grass-lo) var(--grass-hi) var(--grass-hi) var(--grass-lo); }
.play.stop { background: var(--red); border-color: #ff8a7a #7a1a10 #7a1a10 #ff8a7a; text-shadow: 2px 2px 0 #7a1a10; }

/* top bar */
.top {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
  background: var(--stone-lo); border-bottom: 4px solid #000;
}
.top .title { font-size: 1.35rem; letter-spacing: 0.06em; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
.top .title b { color: var(--gold); }
.top .hint { flex: 1; min-width: 0; font-family: var(--word); font-weight: 800; font-size: 1rem; color: var(--gem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* narrow screens: the hint gets its own row instead of pushing the bar wider than the screen */
@media (max-width: 960px) { .top { flex-wrap: wrap; } .top .hint { order: 9; flex-basis: 100%; white-space: normal; } }
.count { font-family: var(--word); font-weight: 900; font-size: 1rem; color: var(--ink); background: #000; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* main */
.main { display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.side {
  display: grid; gap: 10px; align-content: start; min-height: 0;
  padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: var(--stone-lo); border-top: 4px solid #000;
}
@media (min-aspect-ratio: 5/4) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(360px, 470px); grid-template-rows: minmax(0, 1fr); }
  .side { border-top: 0; border-left: 4px solid #000; grid-template-rows: minmax(0, 1fr) auto; align-content: stretch; }
  .rules { max-height: none !important; }
}

/* factory scene */
.scene {
  position: relative; min-height: 0; overflow: hidden;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: 14px 12px 12px;
}
.beltRow { display: flex; align-items: center; gap: 0; }
.belt {
  flex: 1; min-width: 0; height: 84px; position: relative;
  background: repeating-linear-gradient(90deg, #34303f 0 18px, var(--belt) 18px 36px);
  border: 4px solid #000; border-right: 0; box-shadow: inset 0 -8px 0 rgba(0,0,0,0.35), inset 0 6px 0 rgba(255,255,255,0.06);
  /* row-reverse: the first item in the queue sits next to the sorter */
  display: flex; flex-direction: row-reverse; align-items: center; justify-content: flex-start; gap: 4px; padding: 0 8px; overflow: hidden;
}
.belt.moving { animation: beltMove 0.6s linear infinite; }
@keyframes beltMove { to { background-position: 36px 0; } }
.sorter {
  flex: none; width: 96px; height: 96px; display: grid; place-items: center; position: relative;
  background: #4a4655; border: 4px solid #000; box-shadow: inset 4px 4px 0 #6e6a7c, inset -4px -4px 0 #26232e;
}
.sorter .lamp { width: 48px; height: 48px; display: grid; place-items: center; background: #15131b; border: 3px solid #000; color: var(--ink-dim); transition: background 0.12s; }
.sorter .lamp svg { width: 32px; height: 32px; display: block; }
.sorter.fire .lamp { background: var(--gold); color: #2a1d00; }
.sorter.bad .lamp { background: var(--red); color: #fff; }
.chute { min-height: 10px; }
.bins { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 10px; }
.bin {
  min-width: 0; display: grid; grid-template-rows: auto 1fr; background: #2b2835;
  border: 4px solid #000; box-shadow: inset 4px 4px 0 #4a4655, inset -4px -4px 0 #18161e;
}
.bin-head { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 4px; background: #000;
  font-family: var(--word); font-weight: 900; font-size: 1rem; color: var(--ink); }
.bin-head svg { width: 22px; height: 22px; display: block; }
.bin-body { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; min-height: 64px; align-content: flex-start; justify-content: center; }
.goal { width: 44px; height: 44px; display: grid; place-items: center; opacity: 0.22; filter: grayscale(0.3); position: relative; }
.goal.filled { opacity: 1; filter: none; animation: land 0.3s steps(3); }
.goal.missing { opacity: 1; filter: none; outline: 3px dashed var(--red); outline-offset: 1px; animation: blinkOut 0.9s steps(2) infinite; }
@keyframes blinkOut { 50% { outline-color: transparent; } }
@keyframes land { from { transform: translateY(-10px) scale(1.3); } to { transform: none; } }
.goal.wrong { opacity: 1; filter: none; }
.goal.wrong::after { content: ""; position: absolute; inset: -2px; background:
  linear-gradient(45deg, transparent 42%, var(--red) 42% 58%, transparent 58%),
  linear-gradient(-45deg, transparent 42%, var(--red) 42% 58%, transparent 58%); }
.item { display: grid; place-items: center; }
.item img { display: block; image-rendering: pixelated; }
.item.B img { width: 56px; height: 56px; }
.item.S img { width: 34px; height: 34px; }
.goal.B img { width: 40px; height: 40px; }
.goal.S img { width: 24px; height: 24px; }
.flyer { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; }

/* rules */
.rules {
  min-height: 90px; max-height: 32vh; overflow-y: auto;
  background: #0e0c14; border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--stone);
  padding: 8px; display: grid; gap: 8px; align-content: start;
}
.rule {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px;
  background: rgba(63, 127, 216, 0.16); border: 3px solid var(--c-if);
}
.rule.else { background: rgba(201, 150, 42, 0.16); border-color: var(--c-else); }
.rule.fire { border-color: var(--gold); background: rgba(255, 204, 51, 0.28); }
.rule.err { border-color: var(--red); }
.tag { font-family: var(--word); font-weight: 900; font-size: 1.05rem; padding: 4px 8px; color: #fff; background: var(--c-if); letter-spacing: 0.03em; }
.tag.and { background: var(--c-and); }
.tag.else { background: var(--c-else); color: #2a1d00; }
.arrow { font-family: var(--word); font-weight: 900; font-size: 1.4rem; color: var(--ink-dim); }
.cond, .binbtn {
  height: 58px; min-width: 58px; padding: 2px 6px; display: grid; place-items: center; gap: 0; cursor: pointer;
  font-family: var(--word); font-weight: 900; font-size: 0.75rem; color: var(--ink);
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi); box-shadow: 0 0 0 1.5px #000;
}
.cond img { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
.swatch { width: 30px; height: 30px; display: block; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.3), inset 3px 3px 0 rgba(255,255,255,0.25), 0 0 0 2px #000; }
.sizeico { width: 32px; height: 32px; display: grid; place-items: center; }
.sizeico i { display: block; background: var(--ink-dim); box-shadow: inset -3px -3px 0 rgba(0,0,0,0.3), 0 0 0 2px #000; }
.binbtn { min-width: 74px; }
.binbtn svg { width: 28px; height: 28px; display: block; }
.mini { height: 40px; min-width: 40px; padding: 0 8px; font-family: var(--word); font-weight: 900; font-size: 1rem; color: var(--ink); cursor: pointer;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi); box-shadow: 0 0 0 1.5px #000; }
.mini.and { background: var(--c-and); border-color: #c0a0ff #4f2f8a #4f2f8a #c0a0ff; color: #fff; }
.mini.del { margin-left: auto; }
.add {
  height: 52px; font-family: var(--word); font-weight: 900; font-size: 1.15rem; color: #fff; cursor: pointer;
  background: var(--c-if); border: 3px solid; border-color: #7fb0ff #1f4b8f #1f4b8f #7fb0ff; box-shadow: 0 0 0 2px #000;
}
.add:disabled { opacity: 0.4; cursor: default; }
.empty-note { font-family: var(--word); font-weight: 800; color: var(--ink-dim); font-size: 0.95rem; padding: 4px; }
.controls { display: flex; gap: 8px; }
.controls .play { flex: 2; height: 60px; }
.controls .btn:not(.play) { flex: 1; height: 60px; font-family: var(--word); font-weight: 900; font-size: 1rem; }
.busy .rules, .busy .add { pointer-events: none; }
.busy .add { opacity: 0.5; }
.cond:focus-visible, .binbtn:focus-visible, .mini:focus-visible, .add:focus-visible { outline: 3px solid var(--gem); outline-offset: 2px; }

/* picker */
.picker { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: rgba(12, 10, 24, 0.7); }
.pick-panel {
  width: min(100%, 420px); display: grid; gap: 12px; padding: 14px;
  background: rgba(31, 28, 39, 0.98); border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0, 0, 0, 0.45);
}
.pick-group { display: grid; gap: 6px; }
.pick-group h4 { margin: 0; font-family: var(--word); font-weight: 900; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
.pick-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-row .cond { height: 70px; min-width: 70px; font-size: 0.8rem; }
.pick-row .cond.on { outline: 3px solid var(--gold); outline-offset: 2px; }
.pick-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.pick-foot .btn { font-family: var(--word); font-weight: 900; font-size: 1rem; padding: 8px 16px; }

/* bug banner */
.bug {
  /* centered in the empty chute area, so the bins with the red X stay visible */
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4;
  width: min(92%, 420px); display: grid; gap: 8px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.97); padding: 12px 14px 14px;
  border: 4px solid var(--red); box-shadow: 0 0 0 3px #000, 6px 6px 0 3px rgba(0, 0, 0, 0.45);
  animation: rise 0.25s ease-out both;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
.bug h3 { margin: 0; font-family: var(--word); font-weight: 900; font-size: 1.6rem; color: var(--red); letter-spacing: 0.06em; text-shadow: 2px 2px 0 #000; }
.bug .why { display: flex; align-items: center; gap: 10px; }
.bug p { margin: 0; font-family: var(--word); font-weight: 800; font-size: 1.1rem; text-align: left; }
.bug .btn { font-family: var(--word); font-weight: 900; font-size: 1.1rem; padding: 8px 26px; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 45%, rgba(12, 10, 24, 0.4), rgba(12, 10, 24, 0.85) 75%);
  overflow-y: auto;
}
.panel {
  width: 100%; max-width: 440px; display: grid; gap: 14px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.96); padding: 18px 18px 20px;
  border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0, 0, 0, 0.45);
}
h1, h2 { margin: 0; font-weight: 700; line-height: 0.95; letter-spacing: 0.04em; text-wrap: balance; }
h1 { font-family: var(--word); font-weight: 900; font-size: clamp(2.2rem, 10vw, 3.1rem); color: var(--gold); text-shadow: 4px 4px 0 #8a5a12, 8px 8px 0 #000; }
h1 span { display: block; color: var(--gem); text-shadow: 4px 4px 0 #157a70, 8px 8px 0 #000; }
h2 { font-family: var(--word); font-weight: 900; font-size: clamp(2rem, 9vw, 2.6rem); color: var(--gem); text-shadow: 3px 3px 0 #157a70, 6px 6px 0 #000; }
.lead { margin: 0; font-family: var(--word); font-weight: 700; font-size: 1.05rem; line-height: 1.4; max-width: 32ch; }
.seg { display: flex; }
.seg .btn { font-size: 0.95rem; padding: 4px 14px; }
.seg .btn[aria-pressed="true"] { background: var(--gold); color: #2a1d00; border-color: #fff0a8 #b8861a #b8861a #fff0a8; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
.lvl {
  aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; align-content: center; gap: 4px; padding: 4px;
  font-family: var(--pixel); font-weight: 700; font-size: 1.6rem; color: var(--ink);
}
.lvl.andy { background: #3e2d5c; }
.lvl.cur { outline: 3px solid var(--gold); outline-offset: 3px; }
.lvl:disabled { opacity: 0.35; }
.stars { display: flex; gap: 2px; justify-content: center; }
.star { width: 12px; height: 12px; background: #000; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.star.on { background: var(--gold); }
.stars.big .star { width: 44px; height: 44px; }
.stars.big { gap: 8px; }
.stars.big .star.on { animation: pop 0.35s steps(4) both; }
.stars.big .star:nth-child(2) { animation-delay: 0.15s; }
.stars.big .star:nth-child(3) { animation-delay: 0.3s; }
@keyframes pop { from { transform: scale(1.8); } to { transform: scale(1); } }
.win-note { margin: 0; font-family: var(--word); font-weight: 800; font-size: 1rem; color: var(--ink-dim); }
.win-note b { color: var(--ink); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row-btns .btn { font-family: var(--word); font-weight: 900; font-size: 1.15rem; padding: 10px 22px; }
@media (prefers-reduced-motion: reduce) {
  .belt.moving, .goal.filled, .goal.missing, .stars.big .star.on, .bug { animation: none; }
}
</style>

<div id="app">
  <div class="top">
    <a class="zm-back" href="../">← Meniu</a>
    <button class="btn small" id="toLevels" type="button" data-t="levels">Lygiai</button>
    <div class="title"><span data-t="level">Lygis</span> <b id="lvlNum">1</b></div>
    <div class="hint" id="hint"></div>
    <div class="count" id="count">0</div>
    <button class="btn small" id="mute" type="button" aria-pressed="false" data-t="sound">Garsas</button>
  </div>
  <div class="main">
    <div class="scene" id="scene">
      <div class="beltRow">
        <div class="belt" id="belt" aria-label="Conveyor belt"></div>
        <div class="sorter" id="sorter"><div class="lamp" id="lamp"></div></div>
      </div>
      <div class="chute"></div>
      <div class="bins" id="bins"></div>
      <div class="bug" id="bug" hidden role="alert">
        <h3 data-t="bug">KLAIDA</h3>
        <div class="why"><div class="item" id="bugItem"></div><p id="bugWhy"></p></div>
        <button class="btn" id="fix" type="button" data-t="fix">Taisyti</button>
      </div>
    </div>
    <div class="side">
      <div class="rules" id="rules" aria-label="Rules"></div>
      <div class="controls">
        <button class="btn play" id="run" type="button" data-t="run">PALEISTI</button>
        <button class="btn" id="reset" type="button" data-t="reset">Iš naujo</button>
      </div>
    </div>
  </div>
</div>

<div class="picker" id="picker" hidden>
  <div class="pick-panel" role="dialog" aria-modal="true">
    <div id="pickGroups"></div>
    <div class="pick-foot">
      <button class="btn" id="pickRemove" type="button" data-t="removeAnd">Pašalinti IR</button>
      <button class="btn" id="pickClose" type="button" data-t="close">Uždaryti</button>
    </div>
  </div>
</div>

<div class="overlay" id="levelsOv">
  <div class="panel">
    <div class="seg" role="group" aria-label="Language">
      <button class="btn" type="button" data-lang="lt" aria-pressed="true">LT</button>
      <button class="btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1 id="bigTitle">RŪŠIAVIMO <span>FABRIKAS</span></h1>
    <p class="lead" data-t="lead"></p>
    <div class="levels" id="levels"></div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<div class="overlay" id="winOv" hidden>
  <div class="panel">
    <h2 data-t="win">SURŪŠIUOTA!</h2>
    <div class="stars big" id="winStars"><i class="star"></i><i class="star"></i><i class="star"></i></div>
    <p class="win-note" id="winNote"></p>
    <div class="row-btns">
      <button class="btn" id="again" type="button" data-t="again">Dar kartą</button>
      <button class="btn play" id="next" type="button" data-t="next">Kitas lygis</button>
    </div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<script>
(() => {
  // site profiles (zaidimai/zm.js); absent in the claude.ai version, so everything falls back
  const ZM = window.ZM || null;
  const NS = (k) => (ZM ? ZM.ns(k) : k);
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- text ---------- */
  const TXT = {
    lt: {
      title: ['RŪŠIAVIMO', 'FABRIKAS'],
      lead: 'Sudaryk taisykles, ir mašina surūšiuos daiktus į dėžes.',
      levels: 'Lygiai', level: 'Lygis', sound: 'Garsas',
      IF: 'JEI', AND: 'IR', ELSE: 'KITAIP', addIf: '+ JEI', addAnd: '+ IR',
      run: 'PALEISTI', stop: 'STOP', reset: 'Iš naujo',
      bug: 'KLAIDA', fix: 'Taisyti', removeAnd: 'Pašalinti IR', close: 'Uždaryti',
      bin: { L: 'Kairė', M: 'Vidurys', R: 'Dešinė' },
      binTo: { L: 'kairę', M: 'vidurinę', R: 'dešinę' },
      why: (b) => `Šis daiktas turėjo patekti į ${b} dėžę.`,
      groups: { col: 'Spalva', kind: 'Forma', size: 'Dydis' },
      val: { r: 'raudona', b: 'mėlyna', g: 'žalia', y: 'geltona', c: 'kubas', o: 'kamuolys', s: 'žvaigždė', d: 'deimantas', B: 'didelis', S: 'mažas' },
      win: 'SURŪŠIUOTA!', again: 'Dar kartą', next: 'Kitas lygis',
      used: (n) => `Taisyklių: <b>${n}</b>.`,
      par: (n) => `3 žvaigždėms reikia <b>${n}</b>.`,
      runsNote: 'Pabandyk pataikyti iš pirmo ar antro karto.',
      perfect: 'Tobulos taisyklės!',
      count: (n) => `Taisyklės: ${n}`,
      empty: 'Spausk „+ JEI“ ir sukurk taisyklę.',
      hints: {
        1: 'Pažiūrėk į dėžes: kas turi patekti į kairę?',
        3: 'KITAIP siunčia visus kitus daiktus.',
        4: 'Dabar rūšiuok pagal formą.',
        5: 'Trys dėžės: reikės dviejų taisyklių.',
        6: 'Dideli ir maži daiktai.',
        8: 'Tvarka svarbi: taisyklės tikrinamos iš viršaus.',
        9: 'IR: turi tikti abi sąlygos.',
      },
    },
    en: {
      title: ['SORTING', 'FACTORY'],
      lead: 'Make rules, and the machine sorts the items into bins.',
      levels: 'Levels', level: 'Level', sound: 'Sound',
      IF: 'IF', AND: 'AND', ELSE: 'ELSE', addIf: '+ IF', addAnd: '+ AND',
      run: 'RUN', stop: 'STOP', reset: 'Reset',
      bug: 'BUG', fix: 'Fix it', removeAnd: 'Remove AND', close: 'Close',
      bin: { L: 'Left', M: 'Middle', R: 'Right' },
      binTo: { L: 'left', M: 'middle', R: 'right' },
      why: (b) => `This item belonged in the ${b} bin.`,
      groups: { col: 'Color', kind: 'Shape', size: 'Size' },
      val: { r: 'red', b: 'blue', g: 'green', y: 'yellow', c: 'cube', o: 'ball', s: 'star', d: 'gem', B: 'big', S: 'small' },
      win: 'SORTED!', again: 'Try again', next: 'Next level',
      used: (n) => `Rules: <b>${n}</b>.`,
      par: (n) => `3 stars need <b>${n}</b>.`,
      runsNote: 'Try to get it right in one or two runs.',
      perfect: 'Perfect rules!',
      count: (n) => `Rules: ${n}`,
      empty: 'Tap “+ IF” to make a rule.',
      hints: {
        1: 'Look at the bins: what goes to the left?',
        3: 'ELSE sends all the other items.',
        4: 'Now sort by shape.',
        5: 'Three bins: you need two rules.',
        6: 'Big and small items.',
        8: 'Order matters: rules are checked from the top.',
        9: 'AND: both conditions must match.',
      },
    },
  };

  /* ---------- levels ----------
     item code: color (r b g y) + kind (c cube, o ball, s star, d gem) + size (B big, S small).
     sol: the reference rules; they decide which bin every item belongs in, and par = sol.length. */
  const C = (a, v) => [a, v];
  const LEVELS = [
    { bins: 'LR', sol: [{ c: [C('col', 'r')], b: 'L' }], els: 'R', items: ['rcB', 'bcB', 'rcB', 'ycB', 'bcB', 'rcB'] },
    { bins: 'LR', sol: [{ c: [C('col', 'b')], b: 'L' }], els: 'R', items: ['bcB', 'roB', 'boB', 'gcB', 'bcB', 'yoB', 'boB'] },
    { bins: 'LR', sol: [{ c: [C('col', 'y')], b: 'R' }], els: 'L', items: ['ycB', 'gcB', 'yoB', 'rcB', 'ycB', 'boB', 'goB'] },
    { bins: 'LR', sol: [{ c: [C('kind', 's')], b: 'L' }], els: 'R', items: ['rsB', 'bcB', 'ysB', 'gsB', 'roB', 'bsB', 'ycB'] },
    { bins: 'LMR', sol: [{ c: [C('kind', 'o')], b: 'L' }, { c: [C('kind', 'd')], b: 'M' }], els: 'R', items: ['roB', 'bdB', 'ycB', 'gdB', 'boB', 'rsB', 'ydB', 'goB'] },
    { bins: 'LR', sol: [{ c: [C('size', 'B')], b: 'L' }], els: 'R', items: ['rcB', 'rcS', 'boS', 'yoB', 'gsS', 'bdB', 'ycS'] },
    { bins: 'LMR', sol: [{ c: [C('size', 'S')], b: 'L' }, { c: [C('col', 'g')], b: 'M' }], els: 'R', items: ['rcS', 'gcB', 'boB', 'yoS', 'goB', 'bsB', 'rdS', 'gsB'] },
    { bins: 'LMR', sol: [{ c: [C('col', 'r')], b: 'L' }, { c: [C('kind', 's')], b: 'M' }], els: 'R', items: ['rsB', 'ysB', 'rcB', 'bsB', 'goB', 'rsS', 'gsB', 'bcB'] },
    { bins: 'LR', sol: [{ c: [C('col', 'r'), C('kind', 'c')], b: 'L' }], els: 'R', items: ['rcB', 'roB', 'bcB', 'rcS', 'rsB', 'gcB', 'rcB'], and: true },
    { bins: 'LMR', sol: [{ c: [C('size', 'B'), C('col', 'y')], b: 'L' }, { c: [C('kind', 's')], b: 'M' }], els: 'R', items: ['ycB', 'ysB', 'ysS', 'rsB', 'yoS', 'bcB', 'yoB', 'gsS'], and: true },
  ];
  LEVELS.forEach((lv) => { lv.par = lv.sol.length; });
  const MAX_RULES = 4;
  const attrsFor = (n) => (n <= 3 ? ['col'] : n <= 5 ? ['col', 'kind'] : ['col', 'kind', 'size']);
  const VALS = { col: ['r', 'b', 'g', 'y'], kind: ['c', 'o', 's', 'd'], size: ['B', 'S'] };
  const parseItem = (code) => ({ col: code[0], kind: code[1], size: code[2], code });
  const matches = (rule, it) => rule.c.every(([a, v]) => it[a] === v);
  // first matching rule wins; -1 means the ELSE rule
  function decide(rules, els, it) {
    for (let i = 0; i < rules.length; i++) if (matches(rules[i], it)) return { i, bin: rules[i].b };
    return { i: -1, bin: els };
  }

  /* ---------- storage ---------- */
  let lang = 'lt', muted = false, progress = { stars: {} };
  try {
    const l = localStorage.getItem('sf-lang'); if (l === 'lt' || l === 'en') lang = l;
    muted = localStorage.getItem('sf-muted') === '1';
    const p = JSON.parse(localStorage.getItem(NS('sf-progress')) || 'null'); if (p && p.stars) progress = p;
  } catch (e) {}
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const unlockedUpTo = () => {
    let n = 1;
    while (n < LEVELS.length && progress.stars[n]) n++;
    return n;
  };

  /* ---------- sound ---------- */
  let actx = null, noiseBuf = null;
  function ensureAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, dur, type = 'square', vol = 0.05, delay = 0, endFreq) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, cutoff) {
    if (muted || !actx || !noiseBuf) return;
    const t0 = actx.currentTime;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t0); f.frequency.exponentialRampToValueAtTime(100, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f).connect(g).connect(actx.destination); src.start(t0); src.stop(t0 + dur);
  }
  const BIN_PITCH = { L: 440, M: 554, R: 659 };
  const sfx = {
    add: () => tone(660, 0.05, 'square', 0.04),
    remove: () => tone(330, 0.06, 'square', 0.04),
    scan: () => tone(880, 0.05, 'square', 0.03),
    drop: (b) => tone(BIN_PITCH[b], 0.09, 'square', 0.045, 0, BIN_PITCH[b] * 0.7),
    land: () => noise(0.08, 0.15, 1400),
    bug: () => { tone(220, 0.16, 'square', 0.06, 0, 110); tone(140, 0.25, 'square', 0.06, 0.15, 70); },
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.13, 'square', 0.05, i * 0.08)),
  };

  /* ---------- pixel sprites (drawn once into data URLs) ---------- */
  const MASK = {
    c: ['oooooooooooo', 'ollllllllllo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo',
        'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'olbbbbbbbbdo', 'oddddddddddo', 'oooooooooooo'],
    o: ['....oooo....', '..oollbboo..', '.olllbbbbbo.', '.ollbbbbbbo.', 'olbbbbbbbbdo', 'olbbbbbbbbdo',
        'obbbbbbbbbdo', 'obbbbbbbbddo', '.obbbbbbddo.', '.obbbbbdddo.', '..oodddddo..', '....oooo....'],
    s: ['.....oo.....', '....olbo....', '....olbo....', 'oooolbbboooo', 'olllbbbbbbdo', '.olbbbbbbdo.',
        '..obbbbbbo..', '..obbbbbbo..', '.obbbddbbbo.', '.obbo..obbo.', 'obbo....obdo', 'ooo......ooo'],
    d: ['............', '..oooooooo..', '.olllbbbbdo.', 'ollbbbbbbddo', 'oooooooooooo', 'obbbbbbbbddo',
        '.obbbbbbddo.', '..obbbbddo..', '...obbddo...', '....obdo....', '.....oo.....', '............'],
  };
  const PAL = {
    r: { b: '#e0402e', l: '#ff8a7a', d: '#9c2418', o: '#2a0d08' },
    b: { b: '#3f7fd8', l: '#8ab8ff', d: '#1f4b8f', o: '#0b1a33' },
    g: { b: '#5cbf3a', l: '#a0ec7a', d: '#2f7a1c', o: '#0f2a08' },
    y: { b: '#f2c230', l: '#fff09a', d: '#b8861a', o: '#2e2205' },
    n: { b: '#b7b1c2', l: '#f3f0f7', d: '#6e6a7c', o: '#141218' },
  };
  const SPR = {};
  function spriteURL(kind, col) {
    const key = kind + col;
    if (SPR[key]) return SPR[key];
    const S = 6, rows = MASK[kind], pal = PAL[col];
    const c = document.createElement('canvas');
    c.width = c.height = 12 * S;
    const g = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x * S, y * S, S, S); } }));
    SPR[key] = c.toDataURL();
    return SPR[key];
  }
  const itemHTML = (it, cls) => `<div class="${cls} ${it.size}"><img src="${spriteURL(it.kind, it.col)}" alt=""></div>`;
  const SWATCH = { r: '#e0402e', b: '#3f7fd8', g: '#5cbf3a', y: '#f2c230' };
  function condIcon(a, v) {
    if (a === 'col') return `<span class="swatch" style="background:${SWATCH[v]}"></span>`;
    if (a === 'kind') return `<img src="${spriteURL(v, 'n')}" alt="">`;
    const s = v === 'B' ? 26 : 13;
    return `<span class="sizeico"><i style="width:${s}px;height:${s}px"></i></span>`;
  }
  const BIN_ICON = {
    L: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12 L11 3 V8 H22 V16 H11 V21 Z" fill="currentColor"/></svg>',
    M: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22 L3 13 H8 V2 H16 V13 H21 Z" fill="currentColor"/></svg>',
    R: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12 L13 3 V8 H2 V16 H13 V21 Z" fill="currentColor"/></svg>',
  };
  const Q_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8 a4 4 0 1 1 6 3.5 c-1.5 1 -2 1.8 -2 3.5 M12 18.5 v2.5" fill="none" stroke="currentColor" stroke-width="3"/></svg>';
  const X_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="4"/></svg>';

  /* ---------- game state ---------- */
  let lvlIdx = 0, L = null, items = [], goals = [];
  let rules = [], els = 'R', runs = 0;
  let running = false, token = 0;
  let pick = null; // { rule, ci }
  const scene = $('scene'), belt = $('belt'), binsEl = $('bins'), rulesEl = $('rules'), sorter = $('sorter'), lamp = $('lamp');

  function loadLevel(i) {
    lvlIdx = i; L = LEVELS[i];
    items = L.items.map(parseItem);
    goals = items.map((it) => decide(L.sol, L.els, it).bin);
    rules = []; els = L.bins[L.bins.length - 1]; runs = 0;
    $('lvlNum').textContent = i + 1;
    resetScene();
    renderRules(); updateHint(); updateCount();
  }

  function resetScene() {
    token++; running = false;
    document.body.classList.remove('busy');
    belt.classList.remove('moving');
    sorter.classList.remove('fire', 'bad');
    lamp.innerHTML = Q_ICON;
    $('bug').hidden = true;
    scene.querySelectorAll('.flyer').forEach((f) => f.remove());
    belt.innerHTML = items.map((it, i) => itemHTML(it, 'item').replace('class="item', `data-i="${i}" class="item`)).join('');
    binsEl.style.setProperty('--n', L.bins.length);
    binsEl.innerHTML = [...L.bins].map((b) => `
      <div class="bin" data-bin="${b}">
        <div class="bin-head">${BIN_ICON[b]}<span>${TXT[lang].bin[b]}</span></div>
        <div class="bin-body">${items.map((it, i) => (goals[i] === b ? itemHTML(it, 'goal').replace('class="goal', `data-i="${i}" class="goal`) : '')).join('')}</div>
      </div>`).join('');
    rulesEl.querySelectorAll('.fire, .err').forEach((e) => e.classList.remove('fire', 'err'));
    setRunLabel();
  }

  /* ---------- rule editing ---------- */
  function renderRules() {
    const t = TXT[lang];
    let h = '';
    rules.forEach((r, i) => {
      h += `<div class="rule" data-r="${i}"><span class="tag">${t.IF}</span>`;
      r.c.forEach(([a, v], ci) => {
        if (ci > 0) h += `<span class="tag and">${t.AND}</span>`;
        h += `<button class="cond" type="button" data-r="${i}" data-ci="${ci}" aria-label="${t.val[v]}">${condIcon(a, v)}<span>${t.val[v]}</span></button>`;
      });
      if (L.and && r.c.length < 2) h += `<button class="mini and" type="button" data-and="${i}">${t.addAnd}</button>`;
      h += `<span class="arrow">&rarr;</span><button class="binbtn" type="button" data-bin="${i}" aria-label="${t.bin[r.b]}">${BIN_ICON[r.b]}<span>${t.bin[r.b]}</span></button>`;
      h += `<button class="mini del" type="button" data-del="${i}" aria-label="x">${X_ICON.replace('viewBox', 'width="18" height="18" viewBox')}</button></div>`;
    });
    if (!rules.length) h += `<div class="empty-note">${t.empty}</div>`;
    h += `<button class="add" type="button" id="addRule" ${rules.length >= MAX_RULES ? 'disabled' : ''}>${t.addIf}</button>`;
    h += `<div class="rule else" data-r="else"><span class="tag else">${t.ELSE}</span><span class="arrow">&rarr;</span>
      <button class="binbtn" type="button" data-bin="else" aria-label="${t.bin[els]}">${BIN_ICON[els]}<span>${t.bin[els]}</span></button></div>`;
    rulesEl.innerHTML = h;
  }
  function updateCount() { $('count').textContent = TXT[lang].count(rules.length); }
  function updateHint() {
    let k = lvlIdx + 1;
    while (k > 0 && !TXT[lang].hints[k]) k--;
    $('hint').textContent = TXT[lang].hints[k] || '';
  }
  function edited() {
    if (running || !$('bug').hidden || scene.querySelector('.goal.filled, .goal.wrong')) resetScene();
    renderRules(); updateCount();
  }
  const nextBin = (b) => L.bins[(L.bins.indexOf(b) + 1) % L.bins.length];

  rulesEl.addEventListener('click', (e) => {
    if (running) return;
    const add = e.target.closest('#addRule');
    if (add) {
      ensureAudio();
      rules.push({ c: [C('col', 'r')], b: L.bins[0] });
      sfx.add(); edited();
      return;
    }
    const cond = e.target.closest('.cond');
    if (cond) { openPicker(+cond.dataset.r, +cond.dataset.ci); return; }
    const andB = e.target.closest('[data-and]');
    if (andB) {
      const r = rules[+andB.dataset.and];
      const used = r.c[0][0];
      const a = attrsFor(lvlIdx + 1).find((x) => x !== used) || 'col';
      r.c.push(C(a, VALS[a][0]));
      sfx.add(); edited();
      openPicker(+andB.dataset.and, 1);
      return;
    }
    const bin = e.target.closest('[data-bin]');
    if (bin) {
      if (bin.dataset.bin === 'else') els = nextBin(els);
      else { const r = rules[+bin.dataset.bin]; r.b = nextBin(r.b); }
      sfx.add(); edited();
      return;
    }
    const del = e.target.closest('[data-del]');
    if (del) { rules.splice(+del.dataset.del, 1); sfx.remove(); edited(); }
  });

  /* ---------- picker ---------- */
  function openPicker(ri, ci) {
    pick = { ri, ci };
    const t = TXT[lang], cur = rules[ri].c[ci];
    $('pickGroups').innerHTML = attrsFor(lvlIdx + 1).map((a) => `
      <div class="pick-group"><h4>${t.groups[a]}</h4><div class="pick-row">${VALS[a].map((v) =>
        `<button class="cond${cur[0] === a && cur[1] === v ? ' on' : ''}" type="button" data-a="${a}" data-v="${v}">${condIcon(a, v)}<span>${t.val[v]}</span></button>`).join('')}</div></div>`).join('');
    $('pickRemove').hidden = ci === 0;
    $('picker').hidden = false;
    const on = $('pickGroups').querySelector('.on') || $('pickGroups').querySelector('.cond');
    if (on) on.focus({ preventScroll: true });
  }
  function closePicker() { $('picker').hidden = true; pick = null; }
  $('pickGroups').addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (!b || !pick) return;
    rules[pick.ri].c[pick.ci] = C(b.dataset.a, b.dataset.v);
    sfx.add(); closePicker(); edited();
  });
  $('pickRemove').addEventListener('click', () => {
    if (pick && pick.ci > 0) { rules[pick.ri].c.splice(pick.ci, 1); sfx.remove(); }
    closePicker(); edited();
  });
  $('pickClose').addEventListener('click', closePicker);
  $('picker').addEventListener('click', (e) => { if (e.target === $('picker')) closePicker(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('picker').hidden) closePicker(); });

  /* ---------- running ---------- */
  const wait = (ms) => new Promise((res) => setTimeout(res, reduce ? Math.min(ms, 60) : ms));
  function center(el) {
    const r = el.getBoundingClientRect(), s = scene.getBoundingClientRect();
    return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
  }
  const place = (f, p) => { f.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -50%)`; };
  async function glide(f, to, ms) {
    const from = f.style.transform;
    const end = `translate(${to.x}px, ${to.y}px) translate(-50%, -50%)`;
    if (reduce || !f.animate) { f.style.transform = end; await wait(ms); return; }
    try {
      const an = f.animate([{ transform: from }, { transform: end }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' });
      await an.finished;
    } catch (e) {}
    f.style.transform = end;
  }
  function setRunLabel() {
    const b = $('run');
    b.textContent = running ? TXT[lang].stop : TXT[lang].run;
    b.classList.toggle('stop', running);
  }

  async function run() {
    if (running) { resetScene(); return; }
    ensureAudio();
    resetScene();
    runs++;
    running = true;
    const my = ++token;
    document.body.classList.add('busy');
    belt.classList.add('moving');
    setRunLabel();
    const rows = () => rulesEl.querySelectorAll('.rule');
    for (let i = 0; i < items.length; i++) {
      if (my !== token) return;
      const q = belt.querySelector(`[data-i="${i}"]`);
      const f = document.createElement('div');
      f.className = 'flyer';
      f.innerHTML = itemHTML(items[i], 'item');
      place(f, center(q));
      scene.appendChild(f);
      q.style.visibility = 'hidden';
      await glide(f, center(sorter), 380);
      if (my !== token) return;
      q.remove();
      const d = decide(rules, els, items[i]);
      const row = d.i < 0 ? rulesEl.querySelector('.rule.else') : rows()[d.i];
      rulesEl.querySelectorAll('.rule.fire').forEach((r) => r.classList.remove('fire'));
      if (row) { row.classList.add('fire'); row.scrollIntoView({ block: 'nearest' }); }
      sorter.classList.add('fire');
      lamp.innerHTML = BIN_ICON[d.bin];
      sfx.scan();
      await wait(320);
      if (my !== token) return;
      const binEl = binsEl.querySelector(`[data-bin="${d.bin}"] .bin-body`);
      sfx.drop(d.bin);
      await glide(f, center(binEl), 380);
      if (my !== token) return;
      f.remove();
      sorter.classList.remove('fire');
      if (d.bin === goals[i]) {
        binsEl.querySelector(`.goal[data-i="${i}"]`).classList.add('filled');
        sfx.land();
      } else {
        // wrong bin: show the item there with a red X, flash its real place, explain
        binEl.insertAdjacentHTML('beforeend', itemHTML(items[i], 'goal wrong'));
        binsEl.querySelector(`.goal[data-i="${i}"]`).classList.add('missing');
        if (row) row.classList.add('err');
        sorter.classList.add('bad');
        lamp.innerHTML = X_ICON;
        $('bugItem').className = 'item ' + items[i].size;
        $('bugItem').innerHTML = `<img src="${spriteURL(items[i].kind, items[i].col)}" alt="">`;
        $('bugWhy').textContent = TXT[lang].why(TXT[lang].binTo[goals[i]]);
        $('bug').hidden = false;
        running = false;
        belt.classList.remove('moving');
        document.body.classList.remove('busy');
        setRunLabel();
        sfx.bug();
        return;
      }
      await wait(90);
    }
    if (my !== token) return;
    running = false;
    belt.classList.remove('moving');
    document.body.classList.remove('busy');
    rulesEl.querySelectorAll('.rule.fire').forEach((r) => r.classList.remove('fire'));
    setRunLabel();
    win();
  }
  $('run').addEventListener('click', run);
  $('fix').addEventListener('click', () => resetScene());
  // Iš naujo: clear all rules. Taisyti keeps them.
  $('reset').addEventListener('click', () => {
    rules = []; els = L.bins[L.bins.length - 1]; runs = 0;
    resetScene(); renderRules(); updateCount();
  });

  function win() {
    const n = rules.length;
    let stars = 3 - (n > L.par ? 1 : 0) - (runs > 2 ? 1 : 0);
    stars = Math.max(1, stars);
    const key = lvlIdx + 1;
    const prevStars = progress.stars[key] || 0;
    progress.stars[key] = Math.max(prevStars, stars);
    save(NS('sf-progress'), JSON.stringify(progress));
    // XP: 10 for a first clear, 20 per newly earned star; record = total stars over all levels
    if (ZM) {
      const total = Object.values(progress.stars).reduce((a, b) => a + b, 0);
      ZM.report('sorting-factory', { score: total, xp: (prevStars ? 0 : 10) + 20 * Math.max(0, stars - prevStars) });
    }
    document.querySelectorAll('#winStars .star').forEach((s, i) => {
      s.classList.remove('on'); void s.offsetWidth;
      s.classList.toggle('on', i < stars);
    });
    const t = TXT[lang];
    $('winNote').innerHTML = t.used(n) + ' ' + (stars === 3 ? t.perfect : n > L.par ? t.par(L.par) : t.runsNote);
    const last = lvlIdx >= LEVELS.length - 1;
    $('next').textContent = last ? t.levels : t.next;
    sfx.win();
    setTimeout(() => { $('winOv').hidden = false; }, 350);
  }

  $('again').addEventListener('click', () => { $('winOv').hidden = true; runs = 0; resetScene(); });
  $('next').addEventListener('click', () => {
    $('winOv').hidden = true;
    if (lvlIdx >= LEVELS.length - 1) { openLevels(); return; }
    loadLevel(lvlIdx + 1);
  });

  /* ---------- levels screen, language, sound ---------- */
  function renderLevels() {
    const up = unlockedUpTo();
    $('levels').innerHTML = LEVELS.map((lv, i) => {
      const n = i + 1, st = progress.stars[n] || 0;
      const stars = [0, 1, 2].map((k) => `<i class="star${k < st ? ' on' : ''}"></i>`).join('');
      return `<button class="btn lvl${lv.and ? ' andy' : ''}${i === lvlIdx ? ' cur' : ''}" type="button" data-lvl="${i}" ${n > up ? 'disabled' : ''}
        aria-label="${TXT[lang].level} ${n}">${n}<span class="stars">${stars}</span></button>`;
    }).join('');
  }
  function openLevels() { resetScene(); renderLevels(); $('levelsOv').hidden = false; }
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lvl]');
    if (!b || b.disabled) return;
    ensureAudio();
    $('levelsOv').hidden = true;
    loadLevel(+b.dataset.lvl);
  });
  $('toLevels').addEventListener('click', openLevels);

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => {
      const v = TXT[lang][el.dataset.t];
      if (typeof v === 'string') el.textContent = v;
    });
    $('bigTitle').innerHTML = `${TXT[lang].title[0]} <span>${TXT[lang].title[1]}</span>`;
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    if (L) { resetScene(); renderRules(); updateHint(); updateCount(); }
    renderLevels();
    save('sf-lang', lang);
  }
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));

  function setMuted(v) {
    muted = v;
    $('mute').setAttribute('aria-pressed', String(muted));
    save('sf-muted', muted ? '1' : '0');
  }
  $('mute').addEventListener('click', () => { setMuted(!muted); if (!muted) ensureAudio(); });
  setMuted(muted);

  loadLevel(Math.min(unlockedUpTo(), LEVELS.length) - 1);
  applyLang();
})();
</script>

</html>
