<title>Teach the AI</title>

<style>
/* layout: top bar; one centered column with the rule card, the teaching stage (example + labels, or the AI test) and the AI's memory of examples */
:root {
  --night: #141b3a;
  --dusk: #3a3570;
  --stone: #3b3846;
  --stone-hi: #6e6a7c;
  --stone-lo: #1f1c27;
  --gold: #ffcc33;
  --gem: #4de8d6;
  --red: #e0402e;
  --grass: #5cbf3a;
  --grass-hi: #8ee35f;
  --grass-lo: #2f7a1c;
  --ink: #f3f0f7;
  --ink-dim: #b7b1c2;
  --well: #0e0c14;
  --pixel: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --word: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  background-image: linear-gradient(180deg, #141b3a 0%, #24204a 70%, #2e2a5c 100%);
  color: var(--ink);
  font-family: var(--word);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
img.px { image-rendering: pixelated; display: block; }

.btn {
  font: inherit; font-weight: 800; color: var(--ink); cursor: pointer; touch-action: manipulation;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 2px #000;
}
.btn:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.btn:active { border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); }
.btn:disabled { opacity: 0.45; cursor: default; }
.small { font-weight: 800; font-size: 0.9rem; padding: 4px 10px; }
.small[aria-pressed="true"] { background: var(--stone-lo); color: var(--ink-dim); text-decoration: line-through; }
.play {
  font-weight: 900; font-size: 1.35rem; letter-spacing: 0.04em; color: #fff;
  background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi);
  text-shadow: 2px 2px 0 var(--grass-lo);
}
.play:active { border-color: var(--grass-lo) var(--grass-hi) var(--grass-hi) var(--grass-lo); }
.play.ready { animation: ready 1.1s ease-in-out infinite; }
@keyframes ready { 50% { box-shadow: 0 0 0 2px #000, 0 0 0 7px rgba(142, 227, 95, 0.45); } }

/* top bar */
.top {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
  background: var(--stone-lo); border-bottom: 4px solid #000;
}
.top .title { flex: 1; min-width: 0; font-weight: 900; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .title b { color: var(--gold); }

/* main column */
.main { overflow-y: auto; min-height: 0; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.col { max-width: 740px; margin: 0 auto; display: grid; gap: 12px; }
.rule {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: var(--stone-lo); border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--stone);
}
.rule .tag { flex: none; background: var(--gold); color: #2a1d00; font-weight: 900; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; }
.rule p { margin: 0; flex: 1; font-weight: 800; font-size: 1.12rem; line-height: 1.3; }
.rule img { width: 36px; height: 36px; flex: none; }

.stage {
  display: grid; gap: 12px; justify-items: center; padding: 14px;
  background: rgba(31, 28, 39, 0.82); border: 4px solid; border-color: var(--stone-hi) #000 #000 var(--stone-hi);
  box-shadow: 0 0 0 2px #000;
}
.ask { margin: 0; font-weight: 900; font-size: 1.25rem; text-align: center; }
.note { margin: 0; font-weight: 800; font-size: 1.05rem; color: var(--gem); text-align: center; max-width: 34ch; }
.creature { width: min(170px, 40vw); height: auto; aspect-ratio: 1; background: var(--well); border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--stone); }
.creature.pop { animation: pop 0.25s steps(3); }
@keyframes pop { from { transform: scale(0.8); } to { transform: scale(1); } }
.labels { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
.lab {
  flex: 1 1 150px; max-width: 250px; min-height: 76px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 900; font-size: 1.3rem;
}
.lab img { width: 44px; height: 44px; }
.feats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.feat { font-weight: 900; font-size: 1.05rem; padding: 10px 14px; min-height: 48px; }
.feat[aria-pressed="true"] { background: var(--gem); color: #0d2a27; border-color: #b8fff6 #157a70 #157a70 #b8fff6; }
.feat[aria-pressed="false"] { opacity: 0.6; text-decoration: line-through; }

/* AI memory of examples */
.mem-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 900; }
.mem-head .robot { display: flex; align-items: center; gap: 8px; }
.mem-head .robot img { width: 30px; height: 30px; }
.count { font-weight: 900; color: var(--ink); background: #000; padding: 3px 10px; font-variant-numeric: tabular-nums; }
.memory {
  display: flex; flex-wrap: wrap; gap: 10px; min-height: 78px; align-content: flex-start;
  background: var(--well); border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--stone); padding: 10px;
}
.memory .empty { font-weight: 800; color: var(--ink-dim); align-self: center; }
.thumb {
  position: relative; width: 60px; height: 60px; padding: 0; flex: none; cursor: pointer;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) #000 #000 var(--stone-hi);
}
.thumb img.c { width: 100%; height: 100%; }
.thumb img.b { position: absolute; right: -8px; bottom: -8px; width: 28px; height: 28px; background: #000; border: 2px solid #000; }
.thumb.flip { animation: flip 0.3s steps(3); }
@keyframes flip { 50% { transform: rotate(-8deg) scale(1.1); } }
.thumb:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.thumb.still { cursor: default; }
.ctrl { display: flex; gap: 10px; }
.ctrl .play { flex: 2; height: 62px; }
.ctrl .btn:not(.play) { flex: 1; height: 62px; font-weight: 900; font-size: 1rem; }

/* test */
.verdict { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-weight: 900; font-size: 1.3rem; min-height: 56px; }
.verdict img { width: 44px; height: 44px; }
.verdict .think { color: var(--ink-dim); }
.mark { width: 50px; height: 50px; display: grid; place-items: center; font-size: 2rem; font-weight: 900; color: #fff; border: 3px solid #000; }
.mark.ok { background: var(--grass); }
.mark.no { background: var(--red); }
.near { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; font-weight: 800; color: var(--ink-dim); }
.results { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; width: 100%; }
.res { position: relative; aspect-ratio: 1; background: var(--well); border: 2px solid #000; }
.res img { width: 100%; height: 100%; }
.res.ok { box-shadow: inset 0 -7px 0 var(--grass); }
.res.no { box-shadow: inset 0 -7px 0 var(--red); }
.res.now { outline: 3px solid var(--gold); outline-offset: 1px; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 45%, rgba(12, 10, 24, 0.4), rgba(12, 10, 24, 0.86) 75%);
  overflow-y: auto;
}
.panel {
  width: 100%; max-width: 460px; display: grid; gap: 14px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.96); padding: 18px 18px 20px;
  border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0, 0, 0, 0.45);
}
h1, h2 { margin: 0; font-weight: 900; line-height: 0.95; letter-spacing: 0.03em; text-wrap: balance; }
h1 { font-size: clamp(2.5rem, 11vw, 3.4rem); color: var(--gold); text-shadow: 4px 4px 0 #8a5a12, 8px 8px 0 #000; }
h1 span { display: block; color: var(--gem); text-shadow: 4px 4px 0 #157a70, 8px 8px 0 #000; }
h2 { font-size: clamp(1.8rem, 8vw, 2.3rem); color: var(--gem); text-shadow: 3px 3px 0 #157a70, 6px 6px 0 #000; }
.hero { width: 96px; height: 96px; }
.lead { margin: 0; font-weight: 700; font-size: 1.05rem; line-height: 1.4; max-width: 32ch; }
.seg { display: flex; }
.seg .btn { font-size: 0.95rem; padding: 4px 14px; }
.seg .btn[aria-pressed="true"] { background: var(--gold); color: #2a1d00; border-color: #fff0a8 #b8861a #b8861a #fff0a8; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
.lvl { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; align-content: center; gap: 4px; padding: 4px; font-family: var(--pixel); font-weight: 700; font-size: 1.7rem; }
.lvl:disabled { opacity: 0.35; }
.stars { display: flex; gap: 2px; justify-content: center; }
.star { width: 14px; height: 14px; background: #000; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.star.on { background: var(--gold); }
.stars.big .star { width: 44px; height: 44px; }
.stars.big { gap: 8px; }
.stars.big .star.on { animation: starpop 0.35s steps(4) both; }
.stars.big .star:nth-child(2) { animation-delay: 0.15s; }
.stars.big .star:nth-child(3) { animation-delay: 0.3s; }
@keyframes starpop { from { transform: scale(1.8); } to { transform: scale(1); } }
.lesson { margin: 0; font-weight: 800; font-size: 1.08rem; line-height: 1.35; max-width: 32ch; color: var(--ink); background: var(--stone-lo); border: 2px solid #000; padding: 10px 12px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row-btns .btn { font-weight: 900; font-size: 1.1rem; padding: 10px 20px; }
@media (prefers-reduced-motion: reduce) {
  .play.ready, .creature.pop, .thumb.flip, .stars.big .star.on { animation: none; }
}
</style>

<script>
(() => {
  // site profiles (zaidimai/zm.js); absent in the claude.ai version, so everything falls back
  const ZM = window.ZM || null;
  const NS = (k) => (ZM ? ZM.ns(k) : k);
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /*CORE-START*/
  const FEATS = ['color', 'horns', 'eyes', 'spots', 'size'];
  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function combos(vary, base) {
    let out = [Object.assign({}, base)];
    for (const f of Object.keys(vary)) {
      const nx = [];
      for (const o of out) for (const v of vary[f]) nx.push(Object.assign({}, o, { [f]: v }));
      out = nx;
    }
    return out;
  }
  // distance = how many of the allowed features differ
  function dist(a, b, feats) { let d = 0; for (const f of feats) if (a[f] !== b[f]) d++; return d; }
  // k-nearest neighbours: the k closest examples vote (ties at the k-th distance vote too), closer votes count more
  function knn(train, x, feats, k = 3) {
    const s = train.map((t, i) => ({ t, i, d: dist(t.c, x, feats) })).sort((p, q) => p.d - q.d || p.i - q.i);
    if (!s.length) return { label: 0, near: [] };
    const kk = Math.min(k, s.length), cut = s[kk - 1].d;
    const w = [0, 0];
    for (const e of s) if (e.d <= cut) w[e.t.label] += 1 / (1 + e.d);
    const label = w[0] === w[1] ? s[0].t.label : w[1] > w[0] ? 1 : 0;
    return { label, near: s.slice(0, 3) };
  }
  // a good teacher shows varied examples: each next one is the most different from those already shown
  function diverse(list, seed) {
    const r = rng(seed), pool = shuffle(list.slice(), r), out = [pool.shift()];
    while (pool.length) {
      let bi = 0, bd = -1;
      pool.forEach((c, i) => { const md = Math.min(...out.map((o) => dist(o, c, FEATS))); if (md > bd) { bd = md; bi = i; } });
      out.push(pool.splice(bi, 1)[0]);
    }
    return out;
  }
  const C3 = ['red', 'blue', 'green'], C4 = ['red', 'blue', 'green', 'yellow'];
  const LEVELS = [
    { pair: 'grumpy', rule: (c) => c.horns === 1, vary: { horns: [1, 0], color: ['red', 'blue'], eyes: [1, 2] }, base: { spots: 0, size: 1 }, min: 4, max: 8, seed: 11 },
    { pair: 'ice', rule: (c) => c.color === 'blue', vary: { color: C4, horns: [1, 0], eyes: [1, 2, 3] }, base: { spots: 0, size: 1 }, min: 4, max: 12, seed: 12 },
    { pair: 'sick', rule: (c) => c.spots === 1, vary: { spots: [1, 0], color: C4, eyes: [1, 2, 3], horns: [1, 0] }, base: { size: 1 }, min: 4, firstCap: 4, max: 14, seed: 1150, order: 'random' },
    { pair: 'grumpy', rule: (c) => c.horns === 1, vary: { horns: [1, 0], color: C3, size: [1, 0], eyes: [1, 2] }, base: { spots: 0 }, min: 6, firstCap: 6, max: 14, seed: 14, special: 'bias' },
    { pair: 'sick', rule: (c) => c.spots === 1, vary: { spots: [1, 0], color: C3, size: [1, 0] }, base: { horns: 0, eyes: 2 }, seed: 15, special: 'mislabel' },
    { pair: 'grumpy', rule: (c) => c.horns === 1, vary: { horns: [1, 0], color: C4, eyes: [1, 2, 3], spots: [1, 0], size: [1, 0] }, base: {}, seed: 157, special: 'features' },
    { pair: 'king', rule: (c) => c.horns === 1 && c.size === 1, vary: { horns: [1, 0], size: [1, 0], color: ['red', 'blue'], eyes: [1, 2] }, base: { spots: 0 }, min: 4, max: 14, seed: 17 },
    { pair: 'night', rule: (c) => c.color === 'blue' || c.eyes === 3, vary: { color: C3, eyes: [1, 2, 3], horns: [1, 0] }, base: { spots: 0, size: 1 }, min: 4, max: 14, seed: 18 },
  ];
  // builds the example stream (or pre-filled memory) and the 10 test monsters for a level
  function buildLevel(L) {
    const all = combos(L.vary, L.base);
    const r = rng(L.seed * 7 + 3);
    const tests = [];
    const tpool = shuffle(all.slice(), r);
    for (let i = 0; tests.length < 10; i++) tests.push(tpool[i % tpool.length]);
    const out = { tests, stream: [], prefill: null };
    if (L.special === 'bias') {
      // every grumpy example is red and big, every friendly one is blue or green and small
      const mk = (list) => list.map(([h, color, size, eyes]) => Object.assign({}, L.base, { horns: h, color, size, eyes }));
      out.stream = mk([
        [1, 'red', 1, 1], [0, 'blue', 0, 1], [1, 'red', 1, 2], [0, 'green', 0, 2], [1, 'red', 1, 1], [0, 'blue', 0, 2],
        [1, 'blue', 0, 1], [0, 'red', 1, 1], [1, 'green', 0, 2], [0, 'red', 1, 2], [1, 'blue', 1, 2], [0, 'red', 0, 1],
        [1, 'red', 0, 2], [0, 'green', 1, 1],
      ]);
      // the test leans on monsters the one-sided examples never showed
      out.tests = mk([
        [1, 'blue', 0, 1], [0, 'red', 1, 2], [1, 'green', 0, 1], [0, 'red', 1, 1], [1, 'blue', 0, 2],
        [1, 'red', 1, 2], [0, 'green', 0, 1], [0, 'red', 0, 2], [1, 'green', 1, 2], [0, 'blue', 1, 1],
      ]);
    } else if (L.special === 'mislabel') {
      const ex = diverse(all, L.seed).slice(0, 8);
      out.prefill = ex.map((c, i) => ({ c, label: (L.rule(c) ? 1 : 0) ^ (i === 2 || i === 5 ? 1 : 0), wrong: i === 2 || i === 5 }));
    } else if (L.special === 'features') {
      const ex = shuffle(all.slice(), rng(L.seed)).slice(0, 8);
      out.prefill = ex.map((c) => ({ c, label: L.rule(c) ? 1 : 0 }));
    } else {
      out.stream = (L.order === 'random' ? shuffle(all.slice(), rng(L.seed)) : diverse(all, L.seed)).slice(0, L.max);
    }
    return out;
  }
  function accuracy(L, data, memory, feats) {
    return data.tests.filter((x) => knn(memory, x, feats).label === (L.rule(x) ? 1 : 0)).length;
  }
/*CORE-END*/

  /* ---------- text ---------- */
  const TXT = {
    lt: {
      title: ['IŠMOKYK', 'AI'],
      lead: 'Tu žinai taisyklę. Parodyk AI pavyzdžių ir patikrink, ar jis išmoko.',
      levels: 'Lygiai', level: 'Lygis', sound: 'Garsas', rule: 'Taisyklė', memory: 'AI atmintis',
      test: 'TESTUOTI AI', restart: 'Iš naujo', faster: 'Greičiau', more: 'Mokyti toliau', next: 'Kitas lygis',
      ask: 'Koks šitas monstras?', empty: 'Dar tuščia. AI nieko nežino.',
      enough: 'Daugiau pavyzdžių kol kas nėra. Testuok AI!',
      checkMem: 'Peržiūrėk AI atmintį. Paliesk monstrą, jei etiketė neteisinga.',
      pickFeats: 'Pasirink, į ką AI žiūri.',
      featsOn: 'AI žiūri į:',
      feat: { color: 'Spalva', horns: 'Ragai', eyes: 'Akys', spots: 'Dėmės', size: 'Dydis' },
      think: 'AI galvoja...', says: 'AI sako:', near: 'Panašiausi:',
      score: (n) => `AI atspėjo ${n} iš 10`,
      pairs: { grumpy: ['Piktas', 'Draugiškas'], ice: ['Ledo', 'Ugnies'], sick: ['Serga', 'Sveikas'], king: ['Karalius', 'Paprastas'], night: ['Nakties', 'Dienos'] },
      rules: [
        'Monstrai su ragais yra pikti.',

    $('gameTitle').innerHTML = `${esc(t[0])} <span>${esc(t[1])}</span>`;
    if (L) renderAll();
  }
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; save('ta-lang', lang); applyLang(); }));
  function setMuted(v) { muted = v; $('mute').setAttribute('aria-pressed', String(muted)); save('ta-muted', muted ? '1' : '0'); }
  $('mute').addEventListener('click', () => { setMuted(!muted); if (!muted) ensureAudio(); });

  $('robotIcon').src = ROBOT;
  $('heroIcon').src = ROBOT;
  setMuted(muted);
  applyLang();
  lvlIdx = Math.min(unlockedUpTo(), LEVELS.length) - 1;
  loadLevel(lvlIdx);
  openLevels();
})();
</script>

</html>
