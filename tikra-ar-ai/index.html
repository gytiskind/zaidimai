<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tikra ar AI?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="../zm.js"></script>
<script src="https://unpkg.com/mqtt@5.16.0/dist/mqtt.min.js"></script>
<script src="net.js"></script>
<style>
/* The tablet: join with a code, then two huge buttons. The picture itself is on the class screen. */
body { padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  min-height: 100dvh; display: grid; }
main { display: grid; gap: 18px; max-width: 900px; width: 100%; margin: 0 auto; grid-template-rows: auto 1fr; }
.view { align-self: center; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 40px; }
.bar .me { margin-left: auto; font-weight: 900; font-size: 1.1rem; }
.panel { background: var(--stone-lo); border: 4px solid; border-color: var(--stone-hi) #000 #000 var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 7px 7px 0 3px rgba(0,0,0,.45); padding: 20px; display: grid; gap: 14px; }
h1 { font-size: clamp(2.6rem, 11vw, 4.2rem); }
label { font-weight: 900; font-size: 1.2rem; display: grid; gap: 6px; }
input { font: 900 1.6rem var(--word); padding: 10px 14px; min-height: 60px; width: 100%; background: #0f0d16; color: var(--ink);
  border: 4px solid var(--stone-hi); }
input:focus { outline: none; border-color: var(--gem); }
#k { letter-spacing: 0.3em; font-size: 2.2rem; max-width: 260px; }
.msg { font-weight: 800; font-size: 1.15rem; color: var(--ink-dim); margin: 0; min-height: 1.4em; }
.msg.bad { color: #ff8a7a; }
.view { display: none; }
.view.on { display: grid; }
.wait { text-align: center; gap: 12px; padding: 30px 10px; }
.wait .hello { font-weight: 900; font-size: 2rem; }
.wait p { margin: 0; font-weight: 800; font-size: 1.3rem; color: var(--ink-dim); }
.look { font-weight: 900; font-size: 1.6rem; text-align: center; margin: 0; color: var(--gold); }
.choices { display: grid; gap: 22px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
.pick { font: 900 clamp(2.4rem, 9vw, 4.4rem) var(--word); min-height: 38vh; border: 6px solid #000; box-shadow: 8px 8px 0 #000;
  cursor: pointer; touch-action: manipulation; display: grid; place-items: center; gap: 4px; align-content: center;
  transition: transform .08s, opacity .15s, filter .15s; color: #fff; -webkit-tap-highlight-color: transparent; }
@media (max-width: 520px) { .pick { min-height: 28vh; } }
.pick span { font-size: 0.42em; font-weight: 800; }
.pick.real { background: var(--real); color: #10300a; }
.pick.ai { background: var(--ai); }
.pick:active { transform: translate(4px, 4px); box-shadow: 4px 4px 0 #000; }
.pick.chosen { border-color: var(--gold); border-width: 10px; }
.pick.dim { opacity: 0.35; filter: grayscale(.6); }
.result { text-align: center; padding: 34px 14px; min-height: 36vh; align-content: center; gap: 10px; border: 6px solid #000; box-shadow: 8px 8px 0 #000; }
.result .r1 { font-weight: 900; font-size: clamp(2.6rem, 10vw, 4.4rem); line-height: 1; }
.result .r2 { font-weight: 900; font-size: 1.5rem; margin: 0; }
.result.good { background: var(--good); color: #0e2a07; }
.result.bad { background: #c8473a; color: #fff; }
.result.none { background: var(--stone); }
.score { text-align: center; font-weight: 900; font-size: 1.3rem; margin: 0; }
.score b { color: var(--gem); }
.endbig { font-weight: 900; font-size: clamp(2rem, 8vw, 3.4rem); margin: 0; text-align: center; }
.endbig b { color: var(--gem); }
.links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.place { display: block; font-weight: 900; font-size: 2.4rem; color: var(--gold); margin-bottom: 8px; }
.host-link { justify-self: center; color: var(--ink-dim); font-weight: 800; font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <a class="wbtn small" href="../" id="back">← Meniu</a>
    <span class="me" id="me"></span>
  </div>

  <section class="view panel" id="v-join">
    <h1>Tikra ar AI?</h1>
    <label>Tavo vardas
      <input id="name" maxlength="14" autocomplete="off" autocapitalize="words" enterkeyhint="next">
    </label>
    <label>Kodas iš ekrano
      <input id="k" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="go">
    </label>
    <button class="wbtn go" id="join">Prisijungti</button>
    <p class="msg" id="jmsg"></p>
    <a class="host-link" href="ekranas.html">Mokytojo ekranas</a>
  </section>

  <section class="view panel wait" id="v-wait">
    <div class="hello" id="hello"></div>
    <p id="wmsg">Laukiam, kol prasidės žaidimas.</p>
  </section>

  <section class="view" id="v-q">
    <p class="look" id="qn">Žiūrėk į ekraną!</p>
    <div class="choices">
      <button class="pick real" data-a="real">TIKRA<span>📷 tikras vaizdas</span></button>
      <button class="pick ai" data-a="ai">AI<span>🤖 sukūrė kompiuteris</span></button>
    </div>
    <p class="msg" id="qmsg"></p>
  </section>

  <section class="view" id="v-r">
    <div class="result" id="res"><div class="r1" id="r1"></div><p class="r2" id="r2"></p></div>
    <p class="score" id="sc"></p>
  </section>

  <section class="view panel wait" id="v-end">
    <p class="endbig" id="endbig"></p>
    <p id="endmsg"></p>
    <div class="links"><a class="wbtn" href="../">← Meniu</a></div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let pid = LS.get('tai-pid');
  if (!pid) { pid = 'k' + Math.random().toString(36).slice(2, 10); LS.set('tai-pid', pid); }

  const params = new URLSearchParams(location.search);
  const zmName = window.ZM && ZM.player() ? ZM.player().name : '';
  $('name').value = LS.get('tai-name') || zmName || '';
  $('k').value = params.get('k') || '';

  let net = null, code = null, name = '', st = null, myAns = {}, joined = false, lastSeq = 0, reported = LS.get('tai-reported') || '';
  const view = (id) => { document.querySelectorAll('.view').forEach((v) => v.classList.remove('on')); $(id).classList.add('on'); };

  function join() {
    name = $('name').value.trim().slice(0, 14);
    const k = $('k').value.replace(/\D/g, '');
    if (!name) { $('jmsg').textContent = 'Įrašyk savo vardą.'; $('jmsg').className = 'msg bad'; $('name').focus(); return; }
    if (k.length !== 4) { $('jmsg').textContent = 'Kodas turi 4 skaitmenis. Jis yra ekrane.'; $('jmsg').className = 'msg bad'; $('k').focus(); return; }
    LS.set('tai-name', name); LS.set('tai-last', k);
    if (net) net.close();
    code = k; st = null; lastSeq = 0; joined = false; myAns = {};
    $('jmsg').className = 'msg'; $('jmsg').textContent = 'Jungiamasi...';
    $('join').disabled = true;
    net = Net(code, onMsg, onStatus);
    net.send('up', { t: 'join', pid, name });
    history.replaceState(null, '', '?k=' + code);
    // no answer from the screen within a while means a wrong code
    setTimeout(() => { if (!st && code === k) { $('join').disabled = false; $('jmsg').className = 'msg bad';
      $('jmsg').textContent = 'Ekranas neatsako. Patikrink kodą ir bandyk dar kartą.'; } }, 9000);
  }
  $('join').onclick = join;
  $('k').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('k').focus(); });

  let online = 0;
  function onStatus(on) {
    online = on;
    if (!on && st) $('qmsg').textContent = 'Ryšys nutrūko. Jungiamasi iš naujo...';
    else if (on && $('qmsg').textContent.startsWith('Ryšys')) $('qmsg').textContent = '';
  }

  function onMsg(sub, m) {
    if (sub !== 'state' || m.t !== 'state' || m.seq < lastSeq) return;
    lastSeq = m.seq; st = m;
    joined = !!(m.players && m.players[pid]);
    render();
  }

  // keep knocking until the screen lists us, and re-send an answer it has not counted yet
  setInterval(() => {
    if (!net || !code) return;
    if (!joined) net.send('up', { t: 'join', pid, name });
    else if (st && st.phase === 'q' && myAns[st.idx] && !st.got.includes(pid)) net.send('up', { t: 'ans', pid, name, idx: st.idx, a: myAns[st.idx] });
  }, 2500);

  document.querySelectorAll('.pick').forEach((b) => b.addEventListener('click', () => {
    if (!st || st.phase !== 'q') return;
    myAns[st.idx] = b.dataset.a;
    net.send('up', { t: 'ans', pid, name, idx: st.idx, a: b.dataset.a });
    if (navigator.vibrate) navigator.vibrate(30);
    render();
  }));

  function render() {
    $('me').textContent = joined ? name : '';
    $('back').style.visibility = st && (st.phase === 'q' || st.phase === 'reveal') ? 'hidden' : 'visible';
    if (!st || !joined) { if (!st) return; view('v-wait'); $('hello').textContent = 'Jungiamasi...'; $('wmsg').textContent = ''; return; }
    if (st.offline) { view('v-wait'); $('hello').textContent = name; $('wmsg').textContent = 'Šįkart žaidžiam be planšečių. Žiūrėk į ekraną!'; return; }
    const score = (st.score && st.score[pid]) || 0;
    if (st.phase === 'lobby') {
      view('v-wait'); $('hello').textContent = 'Sveikas, ' + name + '!'; $('wmsg').textContent = 'Tu prisijungei. Laukiam, kol prasidės žaidimas.';
    } else if (st.phase === 'q') {
      view('v-q');
      const a = myAns[st.idx];
      $('qn').textContent = `${st.rounds > 1 ? st.round + ' raundas · ' : ''}${st.idx + 1} / ${st.n}  ·  Žiūrėk į ekraną!`;
      document.querySelectorAll('.pick').forEach((b) => {
        b.classList.toggle('chosen', a === b.dataset.a);
        b.classList.toggle('dim', !!a && a !== b.dataset.a);
      });
      if (online) $('qmsg').textContent = a ? (st.got.includes(pid) ? 'Atsakymas užskaitytas. Gali dar persigalvoti.' : 'Siunčiama...') : '';
    } else if (st.phase === 'reveal') {
      view('v-r');
      const ok = st.res ? st.res[pid] : undefined;
      const word = st.answer === 'real' ? 'TIKRA' : 'AI';
      const box = $('res');
      if (ok === true) { box.className = 'result good'; $('r1').textContent = 'Teisingai!'; $('r2').textContent = 'Tai ' + word + '.'; }
      else if (ok === false) { box.className = 'result bad'; $('r1').textContent = 'Oi, ne!'; $('r2').textContent = 'Tai buvo ' + word + '.'; }
      else { box.className = 'result none'; $('r1').textContent = 'Nespėjai'; $('r2').textContent = 'Tai buvo ' + word + '.'; }
      $('sc').innerHTML = `Tavo taškai: <b>${score}</b> iš ${st.idx + 1}`;
    } else if (st.phase === 'end') {
      view('v-end');
      $('endbig').innerHTML = `Atspėjai <b>${score}</b> iš ${st.n}!`;
      const place = st.podium && st.podium[pid];
      $('endmsg').innerHTML = place ? `<span class="place">${['', '🥇', '🥈', '🥉'][place]} ${place} vieta!</span>` : '';
      if (st.classMax) $('endmsg').insertAdjacentText('beforeend', `Visa klasė kartu: ${st.classPts} iš ${st.classMax}.`);
      // one report per finished game, even if the page reloads
      const tag = code + ':' + st.round + ':' + Object.keys(st.players).length + ':' + st.classMax;
      if (window.ZM && reported !== tag) { reported = tag; LS.set('tai-reported', tag); ZM.report('tikra-ar-ai', { score, xp: score * 10 }); }
    }
  }

  view('v-join');
  // came back to an open game (page reload): rejoin by itself
  if (params.get('k') && $('name').value && LS.get('tai-last') === params.get('k')) join();
})();
</script>
</body>
</html>
