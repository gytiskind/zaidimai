<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* layout: top bar, then one centered column: the pixel scene (part 1) or the chatbot claim (part 2), with the message and next button below */
:root {
  --night: #141b3a;
  --dusk: #3a3570;
  --stone: #3b3846;
  --stone-hi: #6e6a7c;
  --stone-lo: #1f1c27;
  --gold: #ffcc33;
  --gem: #4de8d6;
  --red: #e0402e;
  --grass: #5cbf3a;
  --grass-hi: #8ee35f;
  --grass-lo: #2f7a1c;
  --plum: #8a5fd0;
  --ink: #f3f0f7;
  --ink-dim: #b7b1c2;
  --scrim: rgba(12, 10, 24, 0.62);
  --pixel: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --word: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  background-image: linear-gradient(180deg, #141b3a 0%, #24204a 100%);
  color: var(--ink);
  font-family: var(--word);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }

.btn {
  font-family: var(--word); font-weight: 900; color: var(--ink); cursor: pointer; touch-action: manipulation;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 2px #000;
}
.btn:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.btn:active { border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); }
.btn:disabled { opacity: 0.45; cursor: default; }
.small { font-weight: 800; font-size: 0.9rem; padding: 4px 10px; }
.small[aria-pressed="true"] { background: var(--stone-lo); color: var(--ink-dim); text-decoration: line-through; }
.play {
  font-size: 1.5rem; letter-spacing: 0.04em; color: #fff; padding: 10px 40px;
  background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi);
  text-shadow: 2px 2px 0 var(--grass-lo);
}
.play:active { border-color: var(--grass-lo) var(--grass-hi) var(--grass-hi) var(--grass-lo); }

/* top bar */
.top {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
  background: var(--stone-lo); border-bottom: 4px solid #000;
}
.top .title { font-weight: 900; font-size: 1.15rem; white-space: nowrap; }
.top .title b { color: var(--gem); }
.top .part { flex: 1; min-width: 0; font-weight: 800; font-size: 1rem; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font-weight: 900; font-size: 1rem; color: var(--ink); background: #000; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* main column */
.main { min-height: 0; overflow-y: auto; display: grid; justify-items: center; align-content: start; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 18px); }
.col { width: 100%; max-width: 760px; display: grid; gap: 14px; justify-items: center; }
.ask { margin: 0; font-weight: 900; font-size: clamp(1.15rem, 3.6vw, 1.5rem); text-align: center; text-wrap: balance; }

.scene {
  position: relative; width: min(100%, calc((100dvh - 290px) * 4 / 3)); min-width: min(100%, 300px); aspect-ratio: 4 / 3;
  box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0, 0, 0, 0.45); cursor: crosshair; touch-action: manipulation;
}
.scene img { display: block; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
.scene.shake { animation: shake 0.35s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.ring {
  position: absolute; border: 5px solid var(--gold); border-radius: 50%; pointer-events: none;
  box-shadow: 0 0 0 3px #000, inset 0 0 0 3px #000; animation: ringIn 0.4s ease-out both;
}
@keyframes ringIn { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.xmark {
  position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; pointer-events: none;
  display: grid; place-items: center; font-weight: 900; font-size: 1.6rem; color: #fff; background: var(--red);
  box-shadow: 0 0 0 3px #000; animation: xFade 0.9s ease-out forwards;
}
@keyframes xFade { 0% { transform: scale(0.4); } 20% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }

.msg {
  width: 100%; max-width: 560px; min-height: 58px; display: grid; place-items: center; text-align: center;
  font-weight: 800; font-size: 1.15rem; line-height: 1.35; padding: 10px 14px;
  background: var(--stone-lo); border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--stone);
}
.msg.good { border-color: var(--gold); color: var(--ink); }
.msg.good b { color: var(--gold); }
.msg.hint { color: var(--gem); }
.next { font-size: 1.3rem; padding: 10px 34px; }

/* part 2: chatbot */
.chat { width: 100%; max-width: 620px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.bot { width: clamp(72px, 16vw, 112px); image-rendering: pixelated; display: block; filter: drop-shadow(4px 4px 0 #000); }
.bubble {
  position: relative; background: #f3f0f7; color: #1b1630; padding: 16px 18px; border: 4px solid #000;
  box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.45); font-weight: 900; font-size: clamp(1.25rem, 4vw, 1.6rem); line-height: 1.3; min-height: 110px;
}
.bubble::before { content: ""; position: absolute; left: -16px; top: 22px; border: 8px solid transparent; border-right-color: #000; border-top-color: #000; }
.bubble .sure { display: block; font-size: 0.75em; color: var(--plum); margin-bottom: 4px; }
.answers { width: 100%; max-width: 620px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { font-size: clamp(1.2rem, 4vw, 1.55rem); padding: 18px 8px; color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45); }
.ans.yes { background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi); }
.ans.no { background: var(--plum); border-color: #c0a0ff #4f2f8a #4f2f8a #c0a0ff; }
.ans.picked { outline: 4px solid var(--gold); outline-offset: 3px; }
.ans.picked:disabled { opacity: 1; }
.verdict { width: 100%; max-width: 620px; display: grid; gap: 4px; text-align: center; padding: 12px 14px; background: var(--stone-lo); border: 3px solid #000; }
.verdict .v { font-weight: 900; font-size: 1.35rem; }
.verdict .v.ok { color: var(--grass-hi); }
.verdict .v.no { color: #ff8a7a; }
.verdict .why { font-weight: 800; font-size: 1.1rem; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 45%, rgba(12, 10, 24, 0.55), rgba(12, 10, 24, 0.92) 75%);
  overflow-y: auto;
}
.panel {
  width: 100%; max-width: 460px; display: grid; gap: 14px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.97); padding: 18px 18px 20px;
  border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0, 0, 0, 0.45);
}
h1, h2 { margin: 0; font-weight: 700; line-height: 0.9; letter-spacing: 0.04em; text-wrap: balance; }
h1 { font-family: var(--pixel); font-size: clamp(2.6rem, 12vw, 3.6rem); color: var(--gem); text-shadow: 4px 4px 0 #157a70, 8px 8px 0 #000; }
h1 span { display: block; color: var(--gold); text-shadow: 4px 4px 0 #8a5a12, 8px 8px 0 #000; }
h2 { font-family: var(--word); font-weight: 900; font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--gold); text-shadow: 3px 3px 0 #8a5a12, 6px 6px 0 #000; }
.lead { margin: 0; font-weight: 700; font-size: 1.05rem; line-height: 1.4; max-width: 34ch; }
.lesson { margin: 0; font-weight: 900; font-size: 1.15rem; line-height: 1.35; color: var(--gem); max-width: 30ch; }
.seg { display: flex; }
.seg .btn { font-size: 0.95rem; padding: 4px 14px; }
.seg .btn[aria-pressed="true"] { background: var(--gold); color: #2a1d00; border-color: #fff0a8 #b8861a #b8861a #fff0a8; }
.intro-pic { width: 160px; image-rendering: pixelated; box-shadow: 0 0 0 3px #000; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.stat { background: var(--stone-lo); border: 2px solid #000; padding: 8px 6px; display: grid; gap: 2px; }
.stat b { font-weight: 900; font-size: 2rem; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat span { font-weight: 800; font-size: 0.8rem; color: var(--ink-dim); letter-spacing: 0.04em; text-transform: uppercase; }
.rec { font-weight: 900; background: var(--gem); color: #0d2a27; padding: 3px 12px; box-shadow: 3px 3px 0 #000; }
.best { margin: 0; font-weight: 800; color: var(--ink-dim); }
.best b { color: var(--ink); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
@media (prefers-reduced-motion: reduce) {
  .scene.shake, .ring, .xmark { animation: none; }
}
</style>

<div id="app">
  <div class="top">
    <a class="zm-back" href="../">← Meniu</a>
    <div class="title"><b>AI</b> <span data-t="titleRest">detektyvas</span></div>
    <div class="part" id="partLabel"></div>

      </div>
      <div class="verdict" id="verdict" hidden aria-live="polite"><span class="v" id="vHead"></span><span class="why" id="vWhy"></span></div>

</div>

<div class="overlay" id="startOv">
  <div class="panel">
    <div class="seg" role="group" aria-label="Language">

      <button class="btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1>AI <span id="startTitle">DETEKTYVAS</span></h1>
    <img class="intro-pic" id="introPic" alt="">
    <p class="lead" data-t="lead"></p>
    <button class="btn play" id="play" type="button" data-t="play">ŽAISTI</button>
    <p class="best"><span data-t="best">Rekordas</span>: <b id="bestStart">0</b></p>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<div class="overlay" id="midOv" hidden>
  <div class="panel">
    <h2 data-t="partBTitle">Tiesa ar AI išsigalvojo?</h2>
    <img class="intro-pic" id="midBot" alt="" style="width:120px;box-shadow:none">
    <p class="lead" data-t="partBLead"></p>
    <button class="btn play" id="startB" type="button" data-t="start">Pradėti</button>
  </div>
</div>

<div class="overlay" id="endOv" hidden>
  <div class="panel">
    <h2 data-t="endTitle">BYLA IŠSPRĘSTA!</h2>
    <div class="stats">
      <div class="stat"><b id="sA">0/8</b><span data-t="foundA">rastos klaidos</span></div>
      <div class="stat"><b id="sB">0/8</b><span data-t="rightB">teisingi atsakymai</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sScore">0</b><span data-t="points">taškai</span></div>
      <div class="stat"><b id="sBest">0</b><span data-t="best">rekordas</span></div>
    </div>
    <div class="rec" id="newBest" hidden data-t="newBest">NAUJAS REKORDAS!</div>
    <p class="lesson" data-t="lesson"></p>
    <div class="row-btns">
      <button class="btn play" id="again" type="button" data-t="again">Dar kartą</button>
      <a class="zm-back" href="../">← Meniu</a>
    </div>
  </div>
</div>

<script>
(() => {
  // site profiles (zaidimai/zm.js); absent in the claude.ai version, so everything falls back
  const ZM = window.ZM || null;
  const NS = (k) => (ZM ? ZM.ns(k) : k);
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- text ---------- */
  const TXT = {
    lt: {
      lead: 'Šiuose piešiniuose paslėptos klaidos, kokias dažnai daro AI. Surask jas, o paskui patikrink, ką sako pokalbių robotas.',
      titleRest: 'detektyvas', startTitle: 'DETEKTYVAS',
      play: 'ŽAISTI', sound: 'Garsas', next: 'Toliau', start: 'Pradėti', again: 'Dar kartą', best: 'Rekordas',
      partA: '1 dalis: rask klaidą', partB: '2 dalis: tiesa ar ne?',
      askA: 'Kur AI suklydo? Paliesk klaidą.',
      miss: 'Ne čia. Ieškok toliau!',
      found: 'Radai!',
      partBTitle: 'Tiesa ar AI išsigalvojo?',
      partBLead: 'Pokalbių robotas kalba labai užtikrintai. Ar jis teisus?',
      yes: 'TIESA', no: 'IŠSIGALVOJO',
      right: 'Teisingai!', wrong: 'Ne visai.',
      isTrue: 'Tai tiesa.', isFalse: 'AI tai išsigalvojo.',
      sure: ['Esu tikras:', 'Žinoma!', 'Tikrai žinau:', 'Be abejo:'],
      endTitle: 'BYLA IŠSPRĘSTA!', foundA: 'rastos klaidos', rightB: 'teisingi atsakymai', points: 'taškai',
      newBest: 'NAUJAS REKORDAS!',
      lesson: 'AI kalba užtikrintai, net kai klysta. Visada patikrink.',
    },
    en: {
      lead: 'These pictures hide the kind of mistakes AI often makes. Find them, then check what the chatbot says.',
      titleRest: 'detective', startTitle: 'DETECTIVE',
      play: 'PLAY', sound: 'Sound', next: 'Next', start: 'Start', again: 'Play again', best: 'Best',
      partA: 'Part 1: find the mistake', partB: 'Part 2: true or not?',
      askA: 'Where did the AI go wrong? Tap the mistake.',
      miss: 'Not there. Keep looking!',
      found: 'Found it!',
      partBTitle: 'True or made up by AI?',
      partBLead: 'The chatbot sounds very sure. Is it right?',
      yes: 'TRUE', no: 'MADE UP',
      right: 'Correct!', wrong: 'Not quite.',
      isTrue: 'This is true.', isFalse: 'The AI made this up.',
      sure: ['I am sure:', 'Of course!', 'I know this:', 'No doubt:'],
      endTitle: 'CASE CLOSED!', foundA: 'mistakes found', rightB: 'right answers', points: 'points',
      newBest: 'NEW RECORD!',
      lesson: 'AI sounds sure even when it is wrong. Always check.',
    },
  };

  /* ---------- chatbot claims (every "true" one is a real fact) ---------- */
  const CLAIMS = [
    { t: true,  lt: 'Lietuvos sostinė yra Vilnius.', en: 'The capital of Lithuania is Vilnius.',
      wlt: 'Vilnius yra Lietuvos sostinė.', wen: 'Vilnius is the capital of Lithuania.' },
    { t: true,  lt: 'Voras turi 8 kojas.', en: 'A spider has 8 legs.',
      wlt: 'Vorai turi 8 kojas, vabzdžiai 6.', wen: 'Spiders have 8 legs, insects have 6.' },
    { t: true,  lt: 'Prie jūros lygio vanduo verda 100 °C temperatūroje.', en: 'At sea level, water boils at 100 °C.',
      wlt: 'Prie jūros lygio vanduo verda 100 °C.', wen: 'At sea level water boils at 100 °C.' },
    { t: true,  lt: 'Mėnulis sukasi aplink Žemę.', en: 'The Moon goes around the Earth.',
      wlt: 'Mėnulis apskrieja Žemę maždaug per mėnesį.', wen: 'The Moon circles the Earth about once a month.' },
    { t: true,  lt: 'Bitės gamina medų.', en: 'Bees make honey.',
      wlt: 'Bitės medų gamina iš gėlių nektaro.', wen: 'Bees make honey from flower nectar.' },
    { t: true,  lt: 'Saulė yra žvaigždė.', en: 'The Sun is a star.',
      wlt: 'Saulė yra mums artimiausia žvaigždė.', wen: 'The Sun is the star closest to us.' },
    { t: true,  lt: 'Pingvinai negali skraidyti.', en: 'Penguins cannot fly.',
      wlt: 'Pingvinai neskraido, bet puikiai plaukia.', wen: 'Penguins do not fly, but they swim very well.' },
    { t: true,  lt: 'Žmogaus širdis yra raumuo.', en: 'The human heart is a muscle.',
      wlt: 'Širdis yra raumuo, kuris varinėja kraują.', wen: 'The heart is a muscle that pumps blood.' },
    { t: true,  lt: 'Metai turi 12 mėnesių.', en: 'A year has 12 months.',
      wlt: 'Metuose yra 12 mėnesių.', wen: 'There are 12 months in a year.' },
    { t: false, lt: 'Žirafos miega po vandeniu.', en: 'Giraffes sleep under water.',
      wlt: 'Žirafos miega ant žemės, dažnai stovėdamos.', wen: 'Giraffes sleep on land, often standing up.' },
    { t: false, lt: 'Lietuvoje yra 400 metrų aukščio kalnas.', en: 'Lithuania has a mountain 400 metres high.',
      wlt: 'Aukščiausia Lietuvos kalva Aukštojas yra apie 294 m.', wen: 'Lithuania’s highest hill, Aukštojas, is about 294 m.' },
    { t: false, lt: 'Pingvinai gyvena Šiaurės ašigalyje.', en: 'Penguins live at the North Pole.',
      wlt: 'Pingvinai gyvena toli nuo Šiaurės ašigalio, daugiausia prie Antarktidos.', wen: 'Penguins live far from the North Pole, mostly near Antarctica.' },
    { t: false, lt: 'Voras yra vabzdys.', en: 'A spider is an insect.',
      wlt: 'Voras ne vabzdys: vabzdžiai turi 6 kojas, vorai 8.', wen: 'A spider is not an insect: insects have 6 legs, spiders 8.' },
    { t: false, lt: 'Žmogus turi 3 plaučius.', en: 'People have 3 lungs.',
      wlt: 'Žmogus turi 2 plaučius.', wen: 'People have 2 lungs.' },
    { t: false, lt: 'Vilnius yra prie jūros.', en: 'Vilnius is by the sea.',
      wlt: 'Vilnius toli nuo jūros. Prie jūros yra Klaipėda.', wen: 'Vilnius is far from the sea. Klaipėda is by the sea.' },
    { t: false, lt: 'Saulė sukasi aplink Žemę.', en: 'The Sun goes around the Earth.',
      wlt: 'Atvirkščiai: Žemė sukasi aplink Saulę.', wen: 'It is the other way round: the Earth goes around the Sun.' },
    { t: false, lt: 'Delfinai yra žuvys.', en: 'Dolphins are fish.',
      wlt: 'Delfinai yra žinduoliai ir kvėpuoja oru.', wen: 'Dolphins are mammals and breathe air.' },
    { t: false, lt: 'Ledas skęsta vandenyje.', en: 'Ice sinks in water.',
      wlt: 'Ledas plūduriuoja, nes yra lengvesnis už vandenį.', wen: 'Ice floats because it is lighter than water.' },
  ];

  /* ---------- pixel drawing helpers (scenes are 80 x 60 pixels) ---------- */
  const SW = 80, SH = 60;
  function makeCanvas(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'));
    return c;
  }
  function painter(g) {
    const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    const P = (x, y, c) => R(x, y, 1, 1, c);

      sceneEl.classList.remove('shake'); void sceneEl.offsetWidth; sceneEl.classList.add('shake');
      const m = $('msgA');
      if (G.misses >= 2) { m.className = 'msg hint'; m.textContent = s.hint[lang]; }
      else { m.className = 'msg'; m.textContent = TXT[lang].miss; }
      sfx.miss();
    }
  });
  $('nextA').addEventListener('click', () => {
    G.i++;
    if (G.i < G.scenes.length) { showScene(); return; }
    G.i = 0;
    $('midOv').hidden = false;
    $('startB').focus({ preventScroll: true });
  });
  $('startB').addEventListener('click', () => {
    $('midOv').hidden = true;
    showPart('B');
    showClaim();
  });

  /* part 2 */
  function showClaim() {
    const q = G.claims[G.i];
    G.done = false;
    $('sure').textContent = TXT[lang].sure[q.sure];
    $('claim').textContent = q.c[lang];
    $('verdict').hidden = true;
    $('nextB').hidden = true;
    ['ansTrue', 'ansFalse'].forEach((id) => { $(id).disabled = false; $(id).classList.remove('picked'); });
    setCount();
  }
  function answer(saysTrue) {
    if (G.done) return;
    G.done = true;
    ensureAudio();
    const q = G.claims[G.i];
    const ok = saysTrue === q.c.t;
    if (ok) { G.right++; G.score += 2; sfx.right(); } else sfx.wrong();
    $(saysTrue ? 'ansTrue' : 'ansFalse').classList.add('picked');
    ['ansTrue', 'ansFalse'].forEach((id) => { $(id).disabled = true; });
    const h = $('vHead');
    h.className = 'v ' + (ok ? 'ok' : 'no');
    h.textContent = (ok ? '✓ ' + TXT[lang].right : '✗ ' + TXT[lang].wrong) + ' ' + (q.c.t ? TXT[lang].isTrue : TXT[lang].isFalse);
    $('vWhy').textContent = q.c['w' + lang];
    $('verdict').hidden = false;
    $('nextB').hidden = false;
    $('nextB').focus({ preventScroll: true });
  }
  $('ansTrue').addEventListener('click', () => answer(true));
  $('ansFalse').addEventListener('click', () => answer(false));
  $('nextB').addEventListener('click', () => {
    G.i++;
    if (G.i < G.claims.length) showClaim(); else endGame();
  });

  /* end */
  function endGame() {
    const isBest = G.score > best;
    if (isBest) { best = G.score; save(NS('ad-best'), String(best)); }
    $('sA').textContent = G.foundClean + '/' + G.scenes.length;
    $('sB').textContent = G.right + '/' + G.claims.length;
    $('sScore').textContent = G.score;
    $('sBest').textContent = best;
    $('bestStart').textContent = best;
    $('newBest').hidden = !isBest || G.score === 0;
    $('endOv').hidden = false;
    sfx.end();
    // max score 32 (8 scenes x 2 + 8 claims x 2); XP 40..120
    if (ZM) ZM.report('ai-detective', { score: G.score, xp: 40 + Math.round(G.score * 2.5) });
    setTimeout(() => $('again').focus({ preventScroll: true }), 50);
  }
  $('again').addEventListener('click', newGame);
  $('play').addEventListener('click', newGame);

  /* language + sound */
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => {
      const v = TXT[lang][el.dataset.t];
      if (typeof v === 'string') el.textContent = v;
    });
    $('startTitle').textContent = TXT[lang].startTitle;
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    save('ad-lang', lang);
  }
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));

  function setMuted(v) {
    muted = v;
    $('mute').setAttribute('aria-pressed', String(muted));
    save('ad-muted', muted ? '1' : '0');
  }
  $('mute').addEventListener('click', () => { setMuted(!muted); if (!muted) ensureAudio(); });
  setMuted(muted);

  $('botImg').src = BOT; $('midBot').src = BOT;
  $('introPic').src = IMG['hand:lt'];
  $('bestStart').textContent = best;
  applyLang();
  showPart('A');
  G.scenes = SCENES.slice();
  showScene();
  try { $('play').focus({ preventScroll: true }); } catch (e) {}
})();
</script>

</html>
