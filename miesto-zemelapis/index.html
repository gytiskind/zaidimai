<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}.zm-back{display:inline-flex;align-items:center;justify-self:center;align-self:center;font:900 0.95rem "Nunito","Arial Rounded MT Bold",system-ui,sans-serif;color:#f3f0f7;text-decoration:none;background:#3b3846;border:3px solid;border-color:#6e6a7c #1f1c27 #1f1c27 #6e6a7c;box-shadow:0 0 0 2px #000;padding:5px 12px;touch-action:manipulation;white-space:nowrap}.zm-back:focus-visible{outline:3px solid #4de8d6;outline-offset:3px}</style>
<script src="../zm.js"></script>
<title>Miesto žemėlapis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Pixelify+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="../fonts/zm-digits.css">
<style>
/* Miesto žemėlapis: kurjeris dviračiu vežioja siuntinius po miestą.
   Moko: pasaulio šalys (Š, P, R, V), atstumas langeliais, mastelis, žemėlapio legenda.
   Išdėstymas kaip Robot Miner: žemėlapis šalia (platūs ekranai) arba virš (aukšti) programos ir mygtukų. */
:root {
  --night: #141b3a;
  --stone: #3b3846;
  --stone-hi: #6e6a7c;
  --stone-lo: #1f1c27;
  --gold: #ffcc33;
  --gem: #4de8d6;
  --red: #e0402e;
  --grass: #5cbf3a;
  --grass-hi: #8ee35f;
  --grass-lo: #2f7a1c;
  --ink: #f3f0f7;
  --ink-dim: #b7b1c2;
  --c-n: #3f7fd8;
  --c-s: #d9822b;
  --c-e: #2fa36a;
  --c-w: #8a5fd0;
  --pixel: "ZM Digits", "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --word: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--pixel); overflow: hidden;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

.btn {
  font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; touch-action: manipulation;
  background: var(--stone); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 2px #000;
}
.btn:focus-visible { outline: 3px solid var(--gem); outline-offset: 3px; }
.btn:active { border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); }
.btn:disabled { opacity: 0.4; cursor: default; }
.small { font-family: var(--word); font-weight: 800; font-size: 0.9rem; padding: 4px 10px; }
.small[aria-pressed="true"] { background: var(--stone-lo); color: var(--ink-dim); text-decoration: line-through; }
.play {
  font-family: var(--word); font-weight: 900; font-size: 1.3rem; letter-spacing: 0.03em; color: #fff;
  background: var(--grass); border-color: var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi); text-shadow: 2px 2px 0 var(--grass-lo);
}
.play:active { border-color: var(--grass-lo) var(--grass-hi) var(--grass-hi) var(--grass-lo); }
.play.stop { background: var(--red); border-color: #ff8a7a #7a1a10 #7a1a10 #ff8a7a; text-shadow: 2px 2px 0 #7a1a10; }

/* viršutinė juosta */
.top { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; background: var(--stone-lo); border-bottom: 4px solid #000; min-width: 0; }
.top > * { flex-shrink: 0; }
.top .title { font-size: 1.3rem; letter-spacing: 0.06em; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
.top .title b { color: var(--gold); }
.top .hint { flex: 1 1 auto; min-width: 0; font-family: var(--word); font-weight: 800; font-size: 1rem; color: var(--gem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font-family: var(--word); font-weight: 900; font-size: 1rem; background: #000; padding: 4px 10px; white-space: nowrap; }

/* pagrindinė dalis */
.main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.boardWrap { position: relative; min-height: 0; display: grid; place-items: center; padding: 12px; overflow: hidden; }
.mapBox { position: relative; }
#board { display: block; image-rendering: pixelated; box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0, 0, 0, 0.45); }
.compass { position: absolute; top: -6px; right: -6px; width: 74px; height: 74px; pointer-events: none; filter: drop-shadow(3px 3px 0 rgba(0,0,0,.6)); }
.scalebar { position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 6px; padding: 3px 8px; background: rgba(0,0,0,.72);
  font-family: var(--word); font-weight: 900; font-size: 0.85rem; pointer-events: none; }
.scalebar i { display: block; height: 8px; background: repeating-linear-gradient(90deg, #fff 0 50%, #000 50% 100%); border: 2px solid #fff; }
.side { display: grid; gap: 10px; align-content: start; min-height: 0; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px); background: var(--stone-lo); border-top: 4px solid #000; }
.lower { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
@media (min-aspect-ratio: 5/4) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); grid-template-rows: minmax(0, 1fr); }
  .side { border-top: 0; border-left: 4px solid #000; grid-template-rows: minmax(0, 1fr) auto; align-content: stretch; }
  .lower { grid-template-columns: auto minmax(0, 1fr); }
  .prog { max-height: none; }
}
/* žemas landscape (Android planšetė su adreso juosta) */
@media (min-aspect-ratio: 5/4) and (max-height: 640px) {
  .top { padding-top: calc(env(safe-area-inset-top, 0px) + 5px); padding-bottom: 5px; gap: 8px; }
  .top .title { font-size: 1.1rem; }
  .boardWrap { padding: 8px; }
  .side { gap: 8px; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .dpad { --k: 54px; }
  .controls .btn { height: 50px; }
  .chip { height: 44px; min-width: 60px; }
  .compass { width: 62px; height: 62px; }
}
@media (max-width: 640px) {
  .top { flex-wrap: wrap; row-gap: 6px; }
  .top .hint { order: 9; flex-basis: 100%; white-space: normal; }
}

/* programa */
.prog { min-height: 68px; max-height: 20vh; overflow-y: auto; background: #0e0c14; border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--stone);
  padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.chip { height: 50px; min-width: 66px; padding: 0 8px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #fff;
  font-family: var(--word); font-weight: 900; font-size: 1.15rem; border: 3px solid; box-shadow: 0 0 0 1.5px #000; position: relative; }
.chip b { font-family: var(--pixel); font-size: 1.15rem; }
.d-Š { background: var(--c-n); border-color: #7fb0ff #1f4b8f #1f4b8f #7fb0ff; }
.d-P { background: var(--c-s); border-color: #ffc27a #8a4a10 #8a4a10 #ffc27a; }
.d-R { background: var(--c-e); border-color: #7fe0a8 #17603a #17603a #7fe0a8; }
.d-V { background: var(--c-w); border-color: #c0a0ff #4f2f8a #4f2f8a #c0a0ff; }
.chip.now { outline: 4px solid var(--gold); outline-offset: 2px; transform: translateY(-3px); }
.chip.err { outline: 4px solid var(--red); outline-offset: 2px; }
.empty-note { font-family: var(--word); font-weight: 800; color: var(--ink-dim); font-size: 0.95rem; align-self: center; padding: 0 4px; }

/* pasaulio šalių pultas */
.dpad { --k: 64px; display: grid; grid-template-columns: repeat(3, var(--k)); grid-template-rows: repeat(3, var(--k)); gap: 5px; }
.dir { display: grid; place-items: center; align-content: center; gap: 0; color: #fff; font-family: var(--word); font-weight: 900; font-size: 1.35rem; line-height: 1;
  border: 3px solid; box-shadow: 0 0 0 2px #000; cursor: pointer; text-shadow: 1px 1px 0 rgba(0,0,0,.5); padding: 0; }
.dir small { font-size: 0.62rem; font-weight: 800; }
.dir:active { transform: translateY(2px); }
.dir:disabled { opacity: 0.25; transform: none; cursor: default; }
.dir[data-d="Š"] { grid-area: 1 / 2; } .dir[data-d="V"] { grid-area: 2 / 1; } .dir[data-d="R"] { grid-area: 2 / 3; } .dir[data-d="P"] { grid-area: 3 / 2; }
.dpad .del { grid-area: 2 / 2; font-family: var(--word); font-weight: 900; font-size: 1.3rem; padding: 0; }
.tips { font-family: var(--word); font-weight: 800; font-size: 0.9rem; color: var(--ink-dim); line-height: 1.35; display: grid; gap: 6px; align-content: center; min-width: 0; }
.tips b { color: var(--ink); }
.controls { display: flex; gap: 8px; }
.controls .play { flex: 2; height: 58px; }
.controls .btn:not(.play) { flex: 1; height: 58px; font-family: var(--word); font-weight: 900; font-size: 1rem; }
.busy .dpad, .busy .prog { pointer-events: none; }
.busy .dpad { opacity: 0.5; }

/* klaidos juosta */
.bug { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2; width: min(92%, 420px); display: grid; gap: 8px; justify-items: center; text-align: center;
  background: rgba(31, 28, 39, 0.96); padding: 12px 14px 14px; border: 4px solid var(--red); box-shadow: 0 0 0 3px #000, 6px 6px 0 3px rgba(0,0,0,.45); }
.bug h3 { margin: 0; font-family: var(--word); font-weight: 900; font-size: 1.5rem; color: var(--red); letter-spacing: 0.04em; text-shadow: 2px 2px 0 #000; }
.bug p { margin: 0; font-family: var(--word); font-weight: 800; font-size: 1.05rem; }
.bug .btn { font-family: var(--word); font-weight: 900; font-size: 1.1rem; padding: 8px 26px; }

/* langai */
.overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: radial-gradient(ellipse at 50% 45%, rgba(12,10,24,.4), rgba(12,10,24,.85) 75%); overflow-y: auto; }
.panel { width: 100%; max-width: 460px; display: grid; gap: 12px; justify-items: center; text-align: center; background: rgba(31,28,39,.96); padding: 18px 18px 20px;
  border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi); box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0,0,0,.45); }
h1, h2 { margin: 0; font-weight: 700; line-height: 0.95; letter-spacing: 0.04em; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 10vw, 3.2rem); color: var(--gold); text-shadow: 4px 4px 0 #8a5a12, 8px 8px 0 #000; }
h1 span { display: block; color: var(--gem); text-shadow: 4px 4px 0 #157a70, 8px 8px 0 #000; }
h2 { font-family: var(--word); font-weight: 900; font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--gem); text-shadow: 3px 3px 0 #157a70, 6px 6px 0 #000; }
.lead { margin: 0; font-family: var(--word); font-weight: 700; font-size: 1.05rem; line-height: 1.4; max-width: 34ch; }
.levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: 100%; }
@media (min-aspect-ratio: 5/4) {
  #levelsOv .panel { max-width: min(960px, 100%); grid-template-columns: minmax(180px, 300px) auto; column-gap: 24px; align-items: center; }
  #levelsOv .panel > * { grid-column: 1; }
  #levelsOv .panel > .levels { grid-column: 2; grid-row: 1 / span 4; width: min(100%, calc((100dvh - 80px) * 1.6)); justify-self: center; }
  #levelsOv h1 { font-size: clamp(1.8rem, 7vh, 3rem); }
  #legendOv .panel, #qOv .panel { max-width: 640px; }
}
.lvl { aspect-ratio: 1; display: grid; place-items: center; align-content: center; gap: 4px; padding: 4px; font-family: var(--pixel); font-weight: 700; font-size: clamp(1rem, 3.4vmin, 1.5rem); }
.lvl .star { width: 11px; height: 11px; }
.lvl.cur { outline: 3px solid var(--gold); outline-offset: 3px; }
.lvl:disabled { opacity: 0.35; }
.stars { display: flex; gap: 2px; justify-content: center; }
.star { width: 14px; height: 14px; background: #000; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.star.on { background: var(--gold); }
.stars.big .star { width: 44px; height: 44px; }
.stars.big { gap: 8px; }
.note { margin: 0; font-family: var(--word); font-weight: 800; font-size: 1rem; color: var(--ink-dim); }
.note b { color: var(--ink); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row-btns .btn { font-family: var(--word); font-weight: 900; font-size: 1.15rem; padding: 10px 22px; }
.answers { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.answers .btn { font-family: var(--pixel); font-size: 1.3rem; padding: 12px 20px; min-width: 120px; }
.answers .btn.wrong { background: var(--red); animation: shake 0.3s steps(3); }
@keyframes shake { 33% { transform: translateX(-6px); } 66% { transform: translateX(6px); } }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; width: 100%; text-align: left; }
.legend div { display: flex; align-items: center; gap: 8px; font-family: var(--word); font-weight: 800; font-size: 0.95rem; }
.legend canvas { width: 36px; height: 36px; image-rendering: pixelated; box-shadow: 0 0 0 2px #000; flex: none; }
@media (prefers-reduced-motion: reduce) { .answers .btn.wrong { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="zm-back" href="../">← Meniu</a>
    <button class="btn small" id="toLevels" type="button">Lygiai</button>
    <div class="title">Lygis <b id="lvlNum">1</b></div>
    <div class="hint" id="hint"></div>
    <div class="count" id="count">Komandų: 0</div>
    <button class="btn small" id="toLegend" type="button">Legenda</button>
    <button class="btn small" id="mute" type="button" aria-pressed="false">Garsas</button>
  </div>
  <div class="main">
    <div class="boardWrap" id="boardWrap">
      <div class="mapBox" id="mapBox">
        <canvas id="board" aria-label="Miesto žemėlapis su kurjeriu"></canvas>
        <svg class="compass" viewBox="0 0 80 80" aria-label="Kompasas: Š viršuje">
          <circle cx="40" cy="40" r="30" fill="#1f1c27" stroke="#000" stroke-width="4"/>
          <polygon points="40,8 47,40 40,36 33,40" fill="#e0402e" stroke="#000" stroke-width="2"/>
          <polygon points="40,72 47,40 40,44 33,40" fill="#f3f0f7" stroke="#000" stroke-width="2"/>
          <polygon points="72,40 40,47 44,40 40,33" fill="#b7b1c2" stroke="#000" stroke-width="2"/>
          <polygon points="8,40 40,47 36,40 40,33" fill="#b7b1c2" stroke="#000" stroke-width="2"/>
          <g font-family="Nunito, sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">
            <text x="40" y="13">Š</text><text x="40" y="78">P</text><text x="73" y="45">R</text><text x="7" y="45">V</text>
          </g>
        </svg>
        <div class="scalebar" id="scalebar" hidden><i id="scaleI"></i><span>100 m</span></div>
      </div>
      <div class="bug" id="bug" hidden role="alert">
        <h3 id="bugTitle">STOP!</h3>
        <p id="bugWhy"></p>
        <button class="btn" id="fix" type="button">Taisyti</button>
      </div>
    </div>
    <div class="side">
      <div class="prog" id="prog" aria-label="Programa"></div>
      <div class="lower">
        <div class="dpad" id="dpad">
          <button class="dir d-Š" type="button" data-d="Š" aria-label="Šiaurė">⬆<small>Š</small></button>
          <button class="dir d-V" type="button" data-d="V" aria-label="Vakarai">⬅<small>V</small></button>
          <button class="btn del" type="button" id="del" aria-label="Ištrinti paskutinę">⌫</button>
          <button class="dir d-R" type="button" data-d="R" aria-label="Rytai">➡<small>R</small></button>
          <button class="dir d-P" type="button" data-d="P" aria-label="Pietūs">⬇<small>P</small></button>
        </div>
        <div class="tips" id="tips"></div>
      </div>
      <div class="controls">
        <button class="btn play" id="run" type="button">VAŽIUOTI</button>
        <button class="btn" id="step" type="button">Žingsnis</button>
        <button class="btn" id="reset" type="button">Iš naujo</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="levelsOv">
  <div class="panel">
    <h1>MIESTO <span>ŽEMĖLAPIS</span></h1>
    <p class="lead">Tu kurjeris. Sudėk kelią pasaulio šalimis ir nuvežk siuntinius.</p>
    <div class="levels" id="levels"></div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<div class="overlay" id="qOv" hidden>
  <div class="panel">
    <h2>MASTELIS</h2>
    <p class="lead" id="qText"></p>
    <div class="answers" id="answers"></div>
    <p class="note" id="qNote"></p>
  </div>
</div>

<div class="overlay" id="winOv" hidden>
  <div class="panel">
    <h2 id="winTitle">PRISTATYTA!</h2>
    <div class="stars big" id="winStars"><i class="star"></i><i class="star"></i><i class="star"></i></div>
    <p class="note" id="winNote"></p>
    <div class="row-btns">
      <button class="btn" id="again" type="button">Dar kartą</button>
      <button class="btn play" id="next" type="button">Kitas lygis</button>
    </div>
    <a class="zm-back" href="../">← Meniu</a>
  </div>
</div>

<div class="overlay" id="legendOv" hidden>
  <div class="panel">
    <h2>LEGENDA</h2>
    <p class="note">Legenda paaiškina, ką reiškia žemėlapio ženklai.</p>
    <div class="legend" id="legend"></div>
    <button class="btn play" id="legendOk" type="button" style="padding:8px 28px">Supratau</button>
  </div>
</div>

<script>
(() => {
  const ZM = window.ZM || null;
  const NS = (k) => (ZM ? ZM.ns(k) : k);
  const $ = (id) => document.getElementById(id);

  /* ---------- lygiai ----------
     . kelias, = tiltas, B kurjerio startas, g pieva, t parkas, h namas, ~ upė.
     P paštas, M mokykla, N namai, S parduotuvė: sustojimai iš eilės (stops).
     r b y: raudonas, mėlynas, geltonas stogas; X (raudonas) ir Y (mėlynas) yra mįslės atsakymas.
     par = mažiausiai komandų (patikrinta paieška), dirs = leidžiamos kryptys. */
  const LEVELS = [
    { g: ['gggggggg','gB....Pg','gggggggg'], stops: 'P', dirs: 'ŠR', par: 1, hint: 'Rytai (R) yra dešinėje. Nuvežk siuntinį į paštą.' },
    { g: ['ggggggg','gggSggg','ggg.ggg','ggg.ggg','gggBggg','ggggggg'], stops: 'S', dirs: 'ŠR', par: 1, hint: 'Šiaurė (Š) yra viršuje. Važiuok į parduotuvę.' },
    { g: ['gggggggg','ghhhhhMg','ghhhhh.g','ghhhhh.g','gB.....g','gggggggg'], stops: 'M', dirs: 'ŠR', par: 2, hint: 'Pirma į rytus, paskui į šiaurę. Mokykla laukia!' },
    { g: ['ggggggggg','ghhhh..Ng','ghhhh.hhg','ghh...hhg','ghh.hhhhg','gB..hhhhg','ggggggggg'], stops: 'N', dirs: 'ŠR', par: 5, hint: 'Laiptai: Š ir R pakaitomis. Suskaičiuok langelius.' },
    { g: ['ggggggggg','gB....hhg','ghhhh.hhg','gS....hhg','ggggggggg'], stops: 'S', par: 3, hint: 'Dabar galima ir į pietus (P), ir į vakarus (V).' },
    { g: ['ggggggggg','gB..g...g','gg.ggg.gg','~~=~~~~~~','gg.ggg.gg','g......Mg','ggggggggg'], stops: 'M', par: 3, hint: 'Per upę važiuojama tik tiltu.' },
    { g: ['gggggggggg','g......B.g','g.tttttt.g','g.tttttt.g','gS.......g','gggggggggg'], stops: 'S', par: 2, hint: 'Parkas užstoja kelią. Kuris kelias trumpesnis?' },
    { g: ['gggggggggg','gP...gg..g','gggg.gg.gg','~~~~=~~=~~','g.......Bg','gggggggggg'], stops: 'P', par: 3, hint: 'Rask tinkamą tiltą ir nuvežk laišką į paštą.' },
    { g: ['ggggggggg','gP.....Mg','g.hhhhh.g','g.hhhhh.g','gB.....Ng','ggggggggg'], stops: 'PMN', par: 3, hint: 'Trys siuntiniai iš eilės: 1 paštas, 2 mokykla, 3 namai.' },
    { g: ['gggggggggg','gS......Ng','g.hhhhhh.g','~=~~~~~~=~','g.hhhPhh.g','gB.......g','gggggggggg'], stops: 'SNP', par: 5, hint: 'Parduotuvė, namai, paštas. Žiūrėk į numerius.' },

    // pėdsakas
    ctx.fillStyle = 'rgba(255,204,51,0.85)';
    for (const p of trail) ctx.fillRect((p.x + 0.5) * T - T * 0.08, (p.y + 0.5) * T - T * 0.08, T * 0.16, T * 0.16);
    // sustojimų numeriai ir rodyklė virš kito sustojimo
    if (!L.riddle) {
      const multi = L.stops.length > 1;
      [...L.stops].forEach((s, i) => {
        L.g.forEach((row, y) => [...row].forEach((c, x) => {
          if (c !== s) return;
          if (i < visited) { ctx.fillStyle = '#2fa36a'; ctx.fillRect(x * T + T * 0.62, y * T + T * 0.02, T * 0.36, T * 0.36); ctx.fillStyle = '#fff'; ctx.font = `900 ${T * 0.3}px Nunito, sans-serif`; ctx.textAlign = 'center'; ctx.fillText('✓', x * T + T * 0.8, y * T + T * 0.3); }
          else if (multi) { ctx.fillStyle = '#000'; ctx.fillRect(x * T + T * 0.6, y * T, T * 0.4, T * 0.4); ctx.fillStyle = '#ffcc33'; ctx.font = `900 ${T * 0.32}px Nunito, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(String(i + 1), x * T + T * 0.8, y * T + T * 0.31); }
          if (i === visited) {
            const bob = Math.sin(t * 5) * T * 0.06, cx = (x + 0.5) * T, top = y * T - T * 0.05 + bob;
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(cx - T * 0.2, top - T * 0.2); ctx.lineTo(cx + T * 0.2, top - T * 0.2); ctx.lineTo(cx, top + T * 0.08); ctx.fill();
            ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.moveTo(cx - T * 0.13, top - T * 0.16); ctx.lineTo(cx + T * 0.13, top - T * 0.16); ctx.lineTo(cx, top + 0.01 * T); ctx.fill();
          }
        }));
      });
    }
    // kurjeris
    let bx = bike.x, by = bike.y;
    if (anim && anim.kind === 'move') { const e = anim.t; bx = anim.fx + (bike.x - anim.fx) * e; by = anim.fy + (bike.y - anim.fy) * e; }
    if (anim && anim.kind === 'bump') { const k = Math.sin(anim.t * Math.PI) * 0.3; bx += anim.dx * k; by += anim.dy * k; }
    ctx.save();
    ctx.translate((bx + 0.5) * T, (by + 0.5) * T);
    ctx.scale(bike.face, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-T * 0.4, T * 0.3, T * 0.8, T * 0.1);
    ctx.drawImage(BIKE, -T * 0.45, -T * 0.4, T * 0.9, T * 0.72);
    ctx.restore();
  }
  function layoutBoard() {
    if (!L) return;
    const r = boardWrap.getBoundingClientRect(); if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    T = Math.floor(Math.max(16, Math.min(96, (r.width - 28) / cols, (r.height - 28) / rows)));
    board.width = Math.round(cols * T * dpr); board.height = Math.round(rows * T * dpr);
    board.style.width = cols * T + 'px'; board.style.height = rows * T + 'px';
    $('scaleI').style.width = T + 'px';
    renderStatic();
  }
  let last = performance.now();
  function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(frame); }

  /* ---------- lygių ekranas, legenda, garsas ---------- */
  function renderLevels() {
    const up = unlockedUpTo();
    $('levels').innerHTML = LEVELS.map((lv, i) => {
      const n = i + 1, st = progress.stars[n] || 0;
      const stars = [0, 1, 2].map((k) => `<i class="star${k < st ? ' on' : ''}"></i>`).join('');
      return `<button class="btn lvl${i === lvlIdx ? ' cur' : ''}" type="button" data-lvl="${i}" ${n > up ? 'disabled' : ''} aria-label="Lygis ${n}">${n}<span class="stars">${stars}</span></button>`;
    }).join('');
  }
  function openLevels() { renderLevels(); $('levelsOv').hidden = false; }
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lvl]'); if (!b || b.disabled) return;
    ensureAudio(); $('levelsOv').hidden = true; loadLevel(+b.dataset.lvl);
  });
  $('toLevels').addEventListener('click', () => { resetBike(); openLevels(); });

  const LEGEND = [['.', 'Kelias'], ['=', 'Tiltas per upę'], ['~', 'Upė'], ['t', 'Parkas'], ['g', 'Pieva'], ['h', 'Namas'],
    ['P', 'Paštas'], ['M', 'Mokykla'], ['N', 'Namai'], ['S', 'Parduotuvė'], ['r', 'Raudonas stogas'], ['b', 'Mėlynas stogas'], ['y', 'Geltonas stogas']];
  function renderLegend() {
    $('legend').innerHTML = LEGEND.map(([c, name], i) => `<div><canvas data-c="${i}" width="16" height="16"></canvas>${name}</div>`).join('');
    $('legend').querySelectorAll('canvas').forEach((cv) => {
      const [c] = LEGEND[+cv.dataset.c], g = cv.getContext('2d');
      const fake = c === '=' ? ['~=~'] : c === '.' ? ['...'] : ['.' + c + '.'];
      drawCell(g, c, 1, 0, fake);
    });
  }
  $('toLegend').addEventListener('click', () => { renderLegend(); $('legendOv').hidden = false; });
  $('legendOk').addEventListener('click', () => { $('legendOv').hidden = true; });

  function setMuted(v) { muted = v; $('mute').setAttribute('aria-pressed', String(muted)); save('mz-muted', muted ? '1' : '0'); }
  $('mute').addEventListener('click', () => { setMuted(!muted); if (!muted) ensureAudio(); });
  setMuted(muted);

  if ('ResizeObserver' in window) new ResizeObserver(layoutBoard).observe(boardWrap); else window.addEventListener('resize', layoutBoard);
  loadLevel(Math.min(unlockedUpTo(), LEVELS.length) - 1);
  renderLevels();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
